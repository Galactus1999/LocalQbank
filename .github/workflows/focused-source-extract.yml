name: Rovex Focused Source Extract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          rm -rf work && mkdir work && unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          echo '=== RENACTIVITY 1-340 ==='
          nl -ba "$p/app/src/main/java/com/localqbank/library/RenActivity.kt" | sed -n '1,340p'
          echo '=== MAIN ACTIVITY 1-240 ==='
          nl -ba "$p/app/src/main/java/com/localqbank/library/MainActivity.kt" | sed -n '1,240p'
          echo '=== PERFORMANCE VIEW ==='
          f="$(find "$p/app/src/main" -name 'RovexPerformanceLabView.kt' -print -quit)"; nl -ba "$f"
          echo '=== FLASHCARD VIEW ==='
          f="$(find "$p/app/src/main" -name 'RovexFlashcardSummaryView.kt' -print -quit)"; nl -ba "$f"
          echo '=== SEARCH ACTIVITY ==='
          nl -ba "$p/app/src/main/java/com/localqbank/library/SearchActivity.kt" | sed -n '1,360p'
          echo '=== PDF/OCR FILE NAMES ==='
          find "$p/app/src/main/java/com/localqbank/library" -type f | grep -Ei 'pdf|ocr|document|import' | sort
          echo '=== PDF/OCR RELEVANT ==='
          grep -RIn --include='*.kt' --include='*.xml' -E 'BenPdf|PDF|Pdf|OCR|ocr|pdf|document' "$p/app/src/main" | head -n 500
