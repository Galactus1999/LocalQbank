name: Rovex Green Verification Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase0:
    name: Phase 0 static + regression gate
    uses: ./.github/workflows/phase0-verification.yml

  android:
    name: Android unit + emulator gate
    needs: phase0
    uses: ./.github/workflows/_adaptive-android.yml
    with:
      # Blank source_file: adaptive discovery selects the current repository source/archive.
      # Core CI must not depend on optional signing or Qualcomm/NPU capabilities.
      strict: false
      require_jvm: true
      require_instrumented: true
    secrets: inherit

  green-gate:
    name: GREEN — verification gate
    needs: [phase0, android]
    runs-on: ubuntu-latest
    if: ${{ needs.phase0.result == 'success' && needs.android.result == 'success' }}
    steps:
      - name: Confirm all required verification stages passed
        run: |
          set -euo pipefail
          echo "PHASE0=PASS"
          echo "JVM_UNIT_TESTS=PASS"
          echo "ANDROID_BUILD=PASS"
          echo "INSTRUMENTED_EMULATOR=PASS"
          echo "GREEN_GATE=PASS"

  fail-closed:
    name: Fail closed on verification failure
    needs: [phase0, android]
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.phase0.result != 'success' || needs.android.result != 'success') }}
    steps:
      - name: Reject non-green verification
        run: |
          echo "Verification gate did not pass."
          echo "Phase 0: ${{ needs.phase0.result }}"
          echo "Android: ${{ needs.android.result }}"
          exit 1
