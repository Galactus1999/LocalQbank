name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q LocalQBank_PhoneBuild.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -d android-project/app
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBank-Pro-v3.0-StudyDashboard
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
