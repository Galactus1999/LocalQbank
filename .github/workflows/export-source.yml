name: Export Rovex Source For Engineering

on:
  push:
    branches: ["ben-multiprovider-work"]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export source tree
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'Rovex_v8.3.235*.zip' -print -quit)
          test -n "$ZIP"
          rm -rf exported-source
          mkdir exported-source
          unzip -q "$ZIP" -d exported-source
          PROJECT=$(find exported-source -name settings.gradle.kts -type f -print -quit)
          test -n "$PROJECT"
          ROOT=$(dirname "$PROJECT")
          echo "Project root: $ROOT"
          cd "$ROOT"
          zip -qr "$GITHUB_WORKSPACE/Rovex_source_export.zip" .
      - name: Upload source export
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-source-export
          path: Rovex_source_export.zip
          retention-days: 1
