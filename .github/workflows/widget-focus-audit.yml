name: Rovex Widget Focus Audit
on: {workflow_dispatch:}
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          echo '=== PERFORMANCE ==='
          cat "$(find "$p/app/src/main" -name RovexPerformanceLabView.kt -print -quit)"
          echo '=== FLASHCARD ==='
          cat "$(find "$p/app/src/main" -name RovexFlashcardSummaryView.kt -print -quit)"
          echo '=== MAIN XML ==='
          cat "$p/app/src/main/res/layout/activity_main.xml"
          echo '=== MAIN HEADER CODE ==='
          grep -nE 'headerTitanic|RovexHeaderTitanic|headerWordmark|RovexHeader|performanceLabViz|flashcardViz' "$p/app/src/main/java/com/localqbank/library/MainActivity.kt"
          echo '=== PDF SETTINGS ==='
          grep -RIn --include='*.kt' --include='*.xml' -E 'BenPdfImportActivity|BenPdfResearchStore|Reference PDFs|pdfEvidence|Pdf' "$p/app/src/main/java/com/localqbank/library" | head -n 200
