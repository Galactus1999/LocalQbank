name: Adaptive Android Build Engine

on:
  workflow_call:
    inputs:
      source_file:
        description: "Optional source ZIP/path; blank means automatic discovery."
        required: false
        default: ""
        type: string
      strict:
        description: "Convert optional capability skips into failures."
        required: false
        default: false
        type: boolean
    secrets:
      ROVEX_SIGNING_KEYSTORE_BASE64:
        required: false
      ROVEX_SIGNING_KEYSTORE_B64:
        required: false
      ROVEX_SIGNING_STORE_PASSWORD:
        required: false
      ROVEX_SIGNING_KEY_ALIAS:
        required: false
      ROVEX_SIGNING_KEY_PASSWORD:
        required: false
      ROVEX_SIGNING_CERT_SHA256:
        description: "Expected persistent Rovex release certificate SHA-256, lowercase hex without colons."
        required: false

permissions:
  contents: read
  actions: read

env:
  SOURCE_FILE: "${{ inputs.source_file }}"
  STRICT_MODE: "${{ inputs.strict }}"
  EMULATOR_PORT: "5554"

jobs:
  adaptive-build:
    name: Adaptive Android build/test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KEYSTORE_B64: "${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}"
      KEYSTORE_B64_LEGACY: "${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}"
      STORE_PASSWORD: "${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}"
      KEY_ALIAS: "${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}"
      KEY_PASSWORD: "${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}"
      EXPECTED_SIGNING_CERT_SHA256: "${{ secrets.ROVEX_SIGNING_CERT_SHA256 }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install baseline Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Discover source and Android module
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/ci/adaptive-discover.sh
          bash .github/ci/adaptive-discover.sh

      - name: Discover Gradle tasks
        id: tasks
        shell: bash
        run: bash .github/ci/adaptive-gradle-tasks.sh

      - name: Run discovered JVM tests
        if: steps.tasks.outputs.unit_task != ''
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ADAPTIVE_PROJECT"
          ./gradlew "$ADAPTIVE_UNIT_TASK" --no-daemon --stacktrace

      - name: Build discovered debug target
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ADAPTIVE_PROJECT"
          ./gradlew "$ADAPTIVE_DEBUG_TASK" --no-daemon --stacktrace

      - name: Build discovered Android test target
        if: steps.tasks.outputs.android_test_task != ''
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ADAPTIVE_PROJECT"
          ./gradlew "$ADAPTIVE_ANDROID_TEST_TASK" --no-daemon --stacktrace

      - name: Discover generated APKs and application identity
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="$(find "$ADAPTIVE_PROJECT" -type f -path '*/build/outputs/apk/debug/*.apk' ! -name '*androidTest*.apk' -print -quit)"
          test_apk="$(find "$ADAPTIVE_PROJECT" -type f -path '*/build/outputs/apk/androidTest/*/*.apk' -print -quit || true)"
          test -n "$debug_apk"
          rm -rf "$GITHUB_WORKSPACE/.adaptive-source/.ci-test-apks"
          mkdir -p "$GITHUB_WORKSPACE/.adaptive-source/.ci-test-apks"
          cp -f "$debug_apk" "$GITHUB_WORKSPACE/.adaptive-source/.ci-test-apks/app-debug.apk"
          if [[ -n "$test_apk" ]]; then
            cp -f "$test_apk" "$GITHUB_WORKSPACE/.adaptive-source/.ci-test-apks/app-debug-androidTest.apk"
            echo 'ADAPTIVE_HAS_TEST_APK=true' >> "$GITHUB_ENV"
          else
            echo 'ADAPTIVE_HAS_TEST_APK=false' >> "$GITHUB_ENV"
          fi
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          [[ -x "$aapt" ]] || { echo "aapt not found: $aapt"; exit 1; }
          package_id="$("$aapt" dump badging "$GITHUB_WORKSPACE/.adaptive-source/.ci-test-apks/app-debug.apk" | awk -F"'" '/^package:/{print $2; exit}')"
          [[ -n "$package_id" ]] || { echo "Unable to determine application package"; exit 1; }
          echo "ADAPTIVE_APPLICATION_ID=$package_id" >> "$GITHUB_ENV"
          is_rovex=false
          [[ "$package_id" == "com.localqbank.library" ]] && is_rovex=true
          echo "ADAPTIVE_IS_ROVEX=$is_rovex" >> "$GITHUB_ENV"
          {
            has_test_apk=false
            if [[ -n "$test_apk" ]]; then has_test_apk=true; fi
            printf 'has_test_apk=%s\n' "$has_test_apk"
            printf 'application_id=%s\n' "$package_id"
            printf 'is_rovex=%s\n' "$is_rovex"
          } >> "$GITHUB_OUTPUT"
          echo "Application ID: $package_id"
          echo "Debug APK: $debug_apk"
          if [[ -n "$test_apk" ]]; then echo "Test APK: $test_apk"; else echo "Test APK: none"; fi

      - name: Prepare KVM
        if: steps.apk.outputs.has_test_apk == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm || true
          test -r /dev/kvm -a -w /dev/kvm

      - name: Run adaptive instrumented tests
        if: env.ADAPTIVE_HAS_TEST_APK == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          working-directory: .adaptive-source
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash "$GITHUB_WORKSPACE/.github/ci/adaptive-instrumentation.sh"

      - name: Record instrumentation skip
        if: steps.apk.outputs.has_test_apk != 'true'
        shell: bash
        run: |
          echo "CAPABILITY SKIPPED: no Android test APK was discovered."

      - name: Upload adaptive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-android-diagnostics
          path: |
            .adaptive-instrumentation.log
            $RUNNER_TEMP/adaptive-android/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build discovered release target
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ADAPTIVE_PROJECT"
          ./gradlew "$ADAPTIVE_RELEASE_TASK" --no-daemon --stacktrace

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail
          release_apk="$(find "$ADAPTIVE_PROJECT" -type f -path '*/build/outputs/apk/release/*.apk' ! -name '*unsigned*' -print -quit || true)"
          if [[ -z "$release_apk" ]]; then
            release_apk="$(find "$ADAPTIVE_PROJECT" -type f -name '*.apk' -path '*/build/outputs/apk/*' ! -name '*androidTest*' -print -quit || true)"
          fi
          [[ -n "$release_apk" ]] || { echo "No release APK discovered."; exit 1; }
          cp -f "$release_apk" "$GITHUB_WORKSPACE/adaptive-release.apk"
          echo "ADAPTIVE_RELEASE_APK=$GITHUB_WORKSPACE/adaptive-release.apk" >> "$GITHUB_ENV"

      - name: Sign release when signing capability is available
        if: steps.discover.outputs.is_application == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$ADAPTIVE_RELEASE_APK"
          if [[ -z "$KEYSTORE_B64" ]]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            if [[ "$ADAPTIVE_IS_ROVEX" == "true" ]]; then
              echo "ROVEX_PRODUCTION_SIGNING_BLOCKED=true" >> "$GITHUB_ENV"
              smoke_apk="$GITHUB_WORKSPACE/adaptive-release-smoke-only.apk"
              cp -f "$apk" "$smoke_apk"
              smoke_ks="$RUNNER_TEMP/rovex-smoke-only.jks"
              keytool -genkeypair -noprompt -keystore "$smoke_ks" -storepass "smoke-only-password" -keypass "smoke-only-password" -alias "rovex-smoke-only" -dname "CN=Rovex CI Smoke Only" -keyalg RSA -keysize 2048 -validity 1 >/dev/null 2>&1
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$smoke_ks" --ks-pass "pass:smoke-only-password" --ks-key-alias "rovex-smoke-only" --key-pass "pass:smoke-only-password" "$smoke_apk"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$smoke_apk"
              echo "ADAPTIVE_RELEASE_SMOKE_APK=$smoke_apk" >> "$GITHUB_ENV"
              echo "BLOCKED: no persistent signing key; a separate test-only signature is used solely for runtime smoke, never for artifact publication."
              exit 0
            fi
            if [[ "$STRICT_MODE" == "true" ]]; then
              echo "FAIL: signing secrets are required in strict mode."
              exit 1
            fi
            echo "CAPABILITY SKIPPED: signing secrets are not configured for this non-Rovex build."
            echo "ADAPTIVE_RELEASE_SMOKE_APK=$apk" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$ADAPTIVE_IS_ROVEX" == "true" && ! "$EXPECTED_SIGNING_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "FAIL: ROVEX_SIGNING_CERT_SHA256 must contain the independently recorded persistent certificate SHA-256 (64 hex characters)."
            exit 1
          fi
          echo "ADAPTIVE_RELEASE_SMOKE_APK=$apk" >> "$GITHUB_ENV"
          ks="$RUNNER_TEMP/adaptive-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/signing.txt"
          if [[ "$ADAPTIVE_IS_ROVEX" == "true" ]]; then
            expected="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            actual="$(awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}' "$RUNNER_TEMP/signing.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            [[ "$actual" == "$expected" ]] || { echo "FAIL: Rovex persistent signing certificate mismatch."; exit 1; }
            echo "PASS: release APK signed with the configured persistent Rovex certificate."
          fi

      - name: Smoke test signed release APK on Android emulator
        if: steps.discover.outputs.is_application == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            set -eu
            adb install -r "$ADAPTIVE_RELEASE_SMOKE_APK"
            adb shell am start -W -n com.localqbank.library/.RovexSplashActivity
            sleep 8
            pid="$(adb shell pidof com.localqbank.library | tr -d '\r' || true)"
            test -n "$pid" || { echo "FAIL: release APK process did not remain alive after launch."; exit 1; }
            adb logcat -d -v brief --pid="$pid" > "$RUNNER_TEMP/release-smoke-logcat.txt"
            if grep -E 'FATAL EXCEPTION|Fatal signal' "$RUNNER_TEMP/release-smoke-logcat.txt"; then
              echo "FAIL: fatal crash detected during release APK startup."
              exit 1
            fi
            echo "PASS: signed release APK installed, launcher Activity started, process remained alive, and no fatal crash was logged."

      - name: Verify Qualcomm runtime when present
        shell: bash
        run: |
          set -euo pipefail
          apk="$ADAPTIVE_RELEASE_APK"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-list.txt"
          if ! grep -Fxq 'lib/arm64-v8a/libzstd-jni-1.5.7-16.so' "$RUNNER_TEMP/apk-list.txt"; then
            echo "FAIL: required arm64 zstd-jni 1.5.7-16 native library is missing from release APK."
            exit 1
          fi
          echo "PASS: required zstd-jni 1.5.7-16 arm64 native library is packaged."
          if unzip -l "$apk" | grep -Eq 'lib/arm64-v8a/lib(Qnn|LiteRt.*Qualcomm)[^ ]*\.so'; then
            unzip -l "$apk" > "$RUNNER_TEMP/apk-list.txt"
            grep -Eq 'lib/arm64-v8a/libQnnHtp[^ ]*\.so' "$RUNNER_TEMP/apk-list.txt"
            echo "Qualcomm runtime detected and basic native-library verification passed."
          else
            echo "CAPABILITY SKIPPED: no Qualcomm native runtime detected."
            if [[ "$STRICT_MODE" == "true" && "$ADAPTIVE_IS_ROVEX" == "true" ]]; then exit 1; fi
          fi

      - name: Package and persist Phase 0 source candidate
        id: phase0source
        if: always() && steps.discover.outputs.is_application == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.adaptive-source"
          test -s "$source_dir/app/build.gradle.kts"
          source_zip="$GITHUB_WORKSPACE/rovex-phase0-source-candidate.zip"
          rm -f "$source_zip"
          (cd "$source_dir" && zip -9 -qr "$source_zip" . -x '.git/*' '.gradle/*' '*/.gradle/*' 'build/*' '*/build/*' 'app/build/*' '*/src/main/jniLibs/*' '*.apk' '*.aab' '*.zip' '*.class' '*.dex' '*.hprof' '*.log' '*.tmp' '.ci-test-apks/*')
          size="$(stat -c%s "$source_zip")"
          test "$size" -lt 25000000
          sha256sum "$source_zip" | tee "$GITHUB_WORKSPACE/rovex-phase0-source-candidate.sha256"
          unzip -t "$source_zip" >/dev/null
          echo "PASS: source candidate ZIP valid; bytes=$size; below 25 MB."
      - name: Upload Phase 0 source candidate
        if: always() && steps.discover.outputs.is_application == 'true' && steps.phase0source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rovex-phase0-source-candidate
          path: |
            rovex-phase0-source-candidate.zip
            rovex-phase0-source-candidate.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce persistent Rovex signing for release publication
        if: steps.discover.outputs.is_application == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ADAPTIVE_IS_ROVEX" == "true" && "${ROVEX_PRODUCTION_SIGNING_BLOCKED:-false}" == "true" ]]; then
            echo "FAIL: release runtime smoke passed only with a temporary test signature. Configure ROVEX_SIGNING_KEYSTORE_BASE64, ROVEX_SIGNING_STORE_PASSWORD, ROVEX_SIGNING_KEY_ALIAS, ROVEX_SIGNING_KEY_PASSWORD, and ROVEX_SIGNING_CERT_SHA256 to publish an update-safe release."
            exit 1
          fi

      - name: Package source and release
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADAPTIVE_PROJECT"
          source_zip="$GITHUB_WORKSPACE/adaptive-source.zip"
          zip -9 -qr "$source_zip" . -x '.git/*' '.gradle/*' '*/.gradle/*' 'build/*' '*/build/*' 'app/build/*' '*/src/main/jniLibs/*' '*.apk' '*.aab' '*.zip' '*.class' '*.dex' '*.hprof' '*.log' '*.tmp'
          size="$(stat -c%s "$source_zip")"
          echo "Source archive size: $size bytes"
          if [[ "$ADAPTIVE_IS_ROVEX" == "true" ]]; then [[ "$size" -lt 25000000 ]]; fi
          test -s "$source_zip"
          (cd "$GITHUB_WORKSPACE" && sha256sum adaptive-release.apk adaptive-source.zip > adaptive-artifacts.sha256 && sha256sum -c adaptive-artifacts.sha256)
          test -s "$GITHUB_WORKSPACE/adaptive-artifacts.sha256"

      - name: Upload adaptive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-android-output
          path: |
            adaptive-release.apk
            adaptive-source.zip
            adaptive-artifacts.sha256
          if-no-files-found: error
          retention-days: 30
