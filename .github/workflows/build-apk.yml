name: Build Ben QBank APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Prepare Android project
        run: |
          set -e

          echo "Checking repository..."

          # Case 1: Android project is already in repository root
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Android project found in repository root."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 2: Android project is inside a ZIP
          echo "Android project not found at root."
          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project or ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          CANDIDATE=$(find android-project \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)

          if [ -z "$CANDIDATE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CANDIDATE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "===== Gradle Wrapper ====="
          test -f "./gradlew"
          chmod +x ./gradlew
          ./gradlew --version

          echo "===== Required files ====="
          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          echo "===== Verify compileSdk 37 ====="
          grep -R \
            -E 'compileSdk(Code)?[[:space:]]*(=|)[[:space:]]*37' \
            app/build.gradle.kts build.gradle.kts gradle 2>/dev/null || {
              echo "ERROR: compileSdk 37 declaration not found."
              exit 1
            }

          echo "===== Verify zstd Android AAR ====="
          grep -R \
            'com.github.luben:zstd-jni:1.5.7-16@aar' \
            app/build.gradle.kts gradle 2>/dev/null || {
              echo "ERROR: Android zstd AAR dependency not found."
              exit 1
            }

      - name: Build Ben
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building Ben..."

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "Ben APK successfully built:"
          ls -lh "$APK"

      - name: Verify APK identity
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK package and version..."

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK"
            apkanalyzer manifest version-code "$APK"
            apkanalyzer manifest version-name "$APK"
          else
            echo "apkanalyzer not available; skipping metadata inspection."
          fi

      - name: Verify zstd native library
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking zstd native library..."

          unzip -l "$APK" | grep \
            'lib/arm64-v8a/libzstd-jni-1.5.7-16.so' || {
              echo "ERROR: zstd ARM64 native library is missing from APK."
              echo "The Android AAR may have been replaced/resolved incorrectly."
              exit 1
            }

          echo "PASS: zstd ARM64 native library is present."

      - name: Upload Ben APK
        uses: actions/upload-artifact@v4
        with:
          name: Ben-QBank-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
