name: Build LocalQBank APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          set -e

          rm -rf android-project
          mkdir android-project

          echo "Finding project ZIP..."
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "LocalQBank_PhoneBuild.zip" -print -quit)

          test -n "$ZIP_FILE"

          echo "Using: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | sort

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR="android-project"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            CANDIDATE=$(find "$PROJECT_DIR" \
              -name "settings.gradle.kts" \
              -type f \
              -print -quit)

            test -n "$CANDIDATE"

            PROJECT_DIR=$(dirname "$CANDIDATE")
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -d "$PROJECT_DIR/app"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully built:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalQBank-v7.13.0
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apkname: Build Local QBank APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project structure
        run: |
          set -e
          echo "Project root:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "Android project structure OK."

      - name: Build debug APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalQBank-v7.13.0
          path: app/build/outputs/apk/debug/app-debug.apk
