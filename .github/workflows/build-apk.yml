name: Build Ben QBank APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clean old GitHub Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Cleaning old workflow artifacts..."
          gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' | while IFS=$'\t' read -r artifact_id artifact_name; do
            echo "Deleting artifact $artifact_id ($artifact_name)"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
          echo "Cleaning old GitHub Actions caches..."
          gh extension install actions/gh-actions-cache --pin v1.2.0 2>/dev/null || true
          if gh actions-cache delete --all --confirm; then
            echo "GitHub Actions cache cleanup: PASS"
          else
            echo "GitHub Actions cache cleanup did not complete through gh-actions-cache; continuing build."
          fi
          echo "Old artifacts/cache cleanup step completed."
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK 37 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          if "$SDKMANAGER" --list | grep -q 'platforms;android-37.0'; then PLATFORM="platforms;android-37.0"; elif "$SDKMANAGER" --list | grep -q 'platforms;android-37'; then PLATFORM="platforms;android-37"; else echo "ERROR: Android API 37 platform was not exposed by sdkmanager."; exit 1; fi
          "$SDKMANAGER" "$PLATFORM" "platform-tools" "build-tools;35.0.0"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"; exit 0; fi
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.ZIP" \) -print -quit)
          test -n "$ZIP_FILE" || { echo "ERROR: No Android project or ZIP file found."; exit 1; }
          echo "Using ZIP: $ZIP_FILE"
          rm -rf android-project && mkdir -p android-project && unzip -q "$ZIP_FILE" -d android-project
          CANDIDATE=$(find android-project -name "settings.gradle.kts" -type f -print -quit)
          test -n "$CANDIDATE" || { echo "ERROR: settings.gradle.kts not found in source ZIP."; exit 1; }
          PROJECT_DIR=$(dirname "$CANDIDATE")
          test -d "$PROJECT_DIR/app"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Verify project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew && chmod +x ./gradlew && ./gradlew --version
          test -f settings.gradle.kts && test -f build.gradle.kts && test -f app/build.gradle.kts
          grep -R 'com\.localqbank\.library' app/build.gradle.kts >/dev/null
          grep -R -E 'compileSdk(Code)?[[:space:]]*(=|)[[:space:]]*37' app/build.gradle.kts >/dev/null
          grep -R 'com\.github\.luben:zstd-jni:1\.5\.7-16@aar' app/build.gradle.kts gradle 2>/dev/null >/dev/null
      - name: Prepare persistent release signing configuration
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ROVEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          ROVEX_SIGNING_KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          ROVEX_SIGNING_STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          ROVEX_SIGNING_KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          ROVEX_SIGNING_KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_b64="${ROVEX_SIGNING_KEYSTORE_BASE64:-}"; if [ -z "$keystore_b64" ]; then keystore_b64="${ROVEX_SIGNING_KEYSTORE_B64:-}"; fi
          test -n "$keystore_b64" && test -n "${ROVEX_SIGNING_STORE_PASSWORD:-}" && test -n "${ROVEX_SIGNING_KEY_ALIAS:-}" && test -n "${ROVEX_SIGNING_KEY_PASSWORD:-}"
          keystore="$RUNNER_TEMP/rovex-release-signing.jks"
          printf '%s' "$keystore_b64" | base64 --decode > "$keystore"; test -s "$keystore"
          echo "ROVEX_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_STORE_PASSWORD=$ROVEX_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_ALIAS=$ROVEX_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_PASSWORD=$ROVEX_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$keystore" -storepass "$ROVEX_SIGNING_STORE_PASSWORD" -alias "$ROVEX_SIGNING_KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"; test -f "$APK"; ls -lh "$APK"; sha256sum "$APK"
      - name: Verify zstd native library
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -F 'lib/arm64-v8a/libzstd-jni-1.5.7-16.so' >/dev/null
      - name: Print release signing fingerprints
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'SHA-1 digest|SHA-256 digest'
      - name: Verify persistent Rovex signing certificate
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          expected_normalized='8DECBEAC906A40546B332F35629313EF6BA6860D1006AAD07B761538228C0153'
          actual=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':')
          echo "Actual certificate (normalized): $actual"; test "$actual" = "$expected_normalized"
      - name: Verify Firebase Google Sign-In SHA-1 matches release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha1=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test -n "$release_sha1"
          python3 - "$release_sha1" <<'PYTHON'
          import json,sys
          sha1=sys.argv[1].lower()
          with open('app/google-services.json',encoding='utf-8') as f: data=json.load(f)
          for client in data.get('client',[]):
              if client.get('client_info',{}).get('android_client_info',{}).get('package_name') != 'com.localqbank.library': continue
              for oauth in client.get('oauth_client',[]):
                  cert=oauth.get('android_info',{}).get('certificate_hash','').replace(':','').lower()
                  if oauth.get('client_type') == 1 and cert == sha1: print('FIREBASE_RELEASE_SHA1=PASS'); raise SystemExit(0)
          raise SystemExit('Firebase google-services.json does not contain the release APK SHA-1 for com.localqbank.library.')
          PYTHON
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-UPDATE-v8.3.236
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
