name: Build Ben QBank APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK / command-line tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # Android 17 = API 37.
      # Some runners expose the platform package as android-37.0,
      # so discover the exact package before installing it.
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          echo "Searching available API 37 packages..."

          "$SDKMANAGER" --list \
            | grep -E 'platforms;android-37([.]0)?$|build-tools;37([.][0-9.]+)?$' \
            || true

          echo "Installing Android platform API 37..."

          if "$SDKMANAGER" --list \
              | grep -q 'platforms;android-37.0'; then
            PLATFORM="platforms;android-37.0"
          elif "$SDKMANAGER" --list \
              | grep -q 'platforms;android-37'; then
            PLATFORM="platforms;android-37"
          else
            echo "ERROR: Android API 37 platform was not exposed by sdkmanager."
            echo "Full available Android platforms:"
            "$SDKMANAGER" --list | grep 'platforms;android-' || true
            exit 1
          fi

          echo "Selected platform: $PLATFORM"

          "$SDKMANAGER" "$PLATFORM"

          echo "Installing platform-tools..."
          "$SDKMANAGER" "platform-tools"

          echo "Installed SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository..."

          # Case 1: Android project is already in repository root
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "Android project found in repository root."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 2: Android project is inside a ZIP
          echo "Android project not found at root."
          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project or ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          CANDIDATE=$(find android-project \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)

          if [ -z "$CANDIDATE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CANDIDATE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Gradle wrapper ====="

          test -f "./gradlew"
          chmod +x ./gradlew

          ./gradlew --version

          echo "===== Required project files ====="

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          echo "===== Package ID ====="

          grep -R \
            'com\.localqbank\.library' \
            app/build.gradle.kts \
            || {
              echo "ERROR: Expected applicationId/package was not found."
              exit 1
            }

          echo "===== compileSdk ====="

          grep -R \
            -E 'compileSdk(Code)?[[:space:]]*(=|)[[:space:]]*37' \
            app/build.gradle.kts \
            || {
              echo "ERROR: compileSdk 37 was not found."
              exit 1
            }

          echo "===== zstd Android AAR ====="

          grep -R \
            'com\.github\.luben:zstd-jni:1\.5\.7-16@aar' \
            app/build.gradle.kts gradle 2>/dev/null \
            || {
              echo "ERROR: zstd Android AAR dependency missing."
              exit 1
            }

          echo "Project configuration checks passed."

      - name: Build Ben
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Ben..."

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Verify zstd native library
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK for zstd ARM64 native library..."

          if ! unzip -l "$APK" \
              | grep -q 'lib/arm64-v8a/libzstd-jni-1.5.7-16.so'; then

            echo "ERROR:"
            echo "lib/arm64-v8a/libzstd-jni-1.5.7-16.so"
            echo "is missing from the final APK."

            echo
            echo "Native libraries actually packaged:"
            unzip -l "$APK" \
              | grep 'lib/' \
              || true

            exit 1
          fi

          echo "PASS:"
          echo "lib/arm64-v8a/libzstd-jni-1.5.7-16.so is present."

      - name: Verify APK identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK identity ====="

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK"
            apkanalyzer manifest version-code "$APK"
            apkanalyzer manifest version-name "$APK"
          else
            echo "apkanalyzer unavailable; skipping metadata display."
          fi

      - name: Upload Ben APK
        uses: actions/upload-artifact@v4
        with:
          name: Ben-QBank-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
