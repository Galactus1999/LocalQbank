name: Build Ben QBank APK

on:
  # Deliberate manual build gate: source-repair commits must NOT consume Actions minutes.
  # Run this workflow only after the full correction batch has been audited.
  workflow_dispatch:
  push:
    branches: ["main"]
  # Build is manual-only to conserve GitHub Actions minutes while repair batches are audited.
  pull_request:
    branches: ["main"]

concurrency:
  group: rovex-release-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean only obsolete Rovex APK artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Cleaning obsolete Rovex release artifacts only; preserving Gradle caches."
          gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            case "$artifact_name" in
              Rovex-UPDATE-*)
                echo "Deleting old APK artifact $artifact_id ($artifact_name)"
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
                ;;
            esac
          done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 37 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          if "$SDKMANAGER" --list | grep -q 'platforms;android-37.0'; then
            PLATFORM="platforms;android-37.0"
          elif "$SDKMANAGER" --list | grep -q 'platforms;android-37'; then
            PLATFORM="platforms;android-37"
          else
            echo "ERROR: Android API 37 platform was not exposed by sdkmanager."
            exit 1
          fi
          "$SDKMANAGER" "$PLATFORM" "platform-tools" "build-tools;35.0.0"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi
          # Accept every versioned Rovex source handoff, not only historical naming
          # families. The previous allow-list caused new sources such as
          # Rovex_v8.3.281_Frankenstein_* and Rovex_v8.3.282_AMOLED_* to be ignored,
          # silently falling back to the persisted v8.3.278 source.
          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname 'Rovex_v*_Source.zip' -print | sort -V)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: no verified Rovex source ZIP found."
            exit 1
          fi
          # Older verified source ZIPs may remain persisted in the repository. Always use
          # the highest-version source instead of failing or accidentally selecting an older one.
          ZIP_FILE="${ZIP_FILES[${#ZIP_FILES[@]}-1]}"
          echo "Using latest verified source ZIP: $ZIP_FILE"
          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "Ignoring older verified source ZIPs:"
            printf '  %s\n' "${ZIP_FILES[@]:0:${#ZIP_FILES[@]}-1}"
          fi
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
          # Compact handoff ZIPs may omit the tiny root Gradle plugin declaration.
          # Keep that declaration version-controlled at repository root and inject it
          # into the selected source before any Gradle configuration/build step.
          test -f build.gradle.kts || {
            echo "ERROR: root build.gradle.kts plugin declaration is missing from repository."
            exit 1
          }
          if [ ! -f android-project/build.gradle.kts ]; then
            cp build.gradle.kts android-project/build.gradle.kts
            echo "Injected repository root Gradle plugin declaration into selected source."
          else
            # The selected v8.3.283 source contains its own root plugin block, but
            # Firebase plugin declarations were omitted. Add the authoritative
            # versions idempotently before Gradle configuration.
            if ! grep -F 'id("com.google.gms.google-services") version "4.5.0" apply false' android-project/build.gradle.kts >/dev/null; then
              sed -i '0,/^}/s//    id("com.google.gms.google-services") version "4.5.0" apply false\\n}/' android-project/build.gradle.kts
            fi
            if ! grep -F 'id("com.google.firebase.crashlytics") version "3.0.8" apply false' android-project/build.gradle.kts >/dev/null; then
              sed -i '0,/^}/s//    id("com.google.firebase.crashlytics") version "3.0.8" apply false\\n}/' android-project/build.gradle.kts
            fi
          grep -F 'id("com.google.gms.google-services") version "4.5.0" apply false' android-project/build.gradle.kts >/dev/null
          grep -F 'id("com.google.firebase.crashlytics") version "3.0.8" apply false' android-project/build.gradle.kts >/dev/null
          CANDIDATE=$(find android-project -name "settings.gradle.kts" -type f -print -quit)
          test -n "$CANDIDATE" || { echo "ERROR: settings.gradle.kts not found in source ZIP."; exit 1; }
          PROJECT_DIR=$(dirname "$CANDIDATE")
          test -d "$PROJECT_DIR/app"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Compact source ZIPs intentionally omit large vendor QNN binaries so the source
      # upload stays below the 25 MB handoff limit. Restore the verified native payload
      # from the already-persisted v8.3.278 Final-Stability source before compilation.
      - name: Restore verified native accelerator payload
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so ]; then
            echo "Native accelerator payload already present."
            exit 0
          fi
          BASELINE=$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f -name 'Rovex_v8.3.278_Final_Stability_Verified_Source.zip' -print -quit)
          if [ -z "$BASELINE" ]; then
            echo "ERROR: verified v8.3.278 baseline source ZIP is required to restore omitted native libraries."
            exit 1
          fi
          TMP="$RUNNER_TEMP/rovex-baseline-native"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$BASELINE" 'app/src/main/jniLibs/*' -d "$TMP"
          test -s "$TMP/app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so"
          rm -rf app/src/main/jniLibs
          cp -a "$TMP/app/src/main/jniLibs" app/src/main/
          echo "Restored verified native accelerator payload from v8.3.278 baseline."
          ls -lh app/src/main/jniLibs/arm64-v8a/

      # Deterministic compile normalization for the architecture source.
      - name: Normalize architecture source compile blockers
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ren = Path("app/src/main/java/com/localqbank/library/RenActivity.kt")
          s = ren.read_text(encoding="utf-8")
          before = s
          s = s.replace("Intent(this,QuizActivity::class.java)", "Intent(this@RenActivity,QuizActivity::class.java)")
          s = s.replace("Intent(this, QuizActivity::class.java)", "Intent(this@RenActivity, QuizActivity::class.java)")
          # The source may already contain the corrected receiver. This normalization
          # must therefore be idempotent; only fail if an uncorrected receiver remains.
          if "Intent(this@RenActivity,QuizActivity::class.java)" not in s and "Intent(this@RenActivity, QuizActivity::class.java)" not in s:
              raise SystemExit("RenActivity compile guard found neither corrected nor normalizable QuizActivity Intent receiver")
          if s != before:
              ren.write_text(s, encoding="utf-8")

          dash = Path("app/src/main/java/com/localqbank/library/RovexSectionDashboardActivity.kt")
          d = dash.read_text(encoding="utf-8")
          if "private fun analyticsHero(" not in d:
              needle = "private fun cards("
              if needle not in d:
                  raise SystemExit("RovexSectionDashboardActivity.kt: cannot place analyticsHero compatibility helper")
              helper = '''private fun analyticsHero(rows: List<Row>) {
              // Stats is intentionally removed from bottom navigation. Keep this legacy helper
              // as a no-op so stale internal references cannot reintroduce the removed UI.
          }

          '''
              d = d.replace(needle, helper + needle, 1)
              dash.write_text(d, encoding="utf-8")
          print("Architecture source compile normalization: PASS")
          PY
          grep -E 'Intent\(this@RenActivity, ?QuizActivity::class\.java\)' app/src/main/java/com/localqbank/library/RenActivity.kt >/dev/null
          grep -F 'private fun analyticsHero(rows: List<Row>)' app/src/main/java/com/localqbank/library/RovexSectionDashboardActivity.kt >/dev/null

      # BenResponsePolicy v2 uses lazy Regex values. The source handoff contained an
      # accidental .value dereference on those nullable Regex objects, which prevented
      # the unit-test Kotlin compilation stage from starting. Normalize that exact defect
      # before Gradle compilation and assert no stale dereference remains.
      - name: Normalize Ben response policy compile blocker
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/localqbank/library/BenResponsePolicy.kt")
          s = p.read_text(encoding="utf-8")
          before = s
          replacements = {
              "styleBlock.value?.let": "styleBlock?.let",
              "scriptBlock.value?.let": "scriptBlock?.let",
              "eventAttribute.value?.let": "eventAttribute?.let",
              "styleAttribute.value?.let": "styleAttribute?.let",
              "cssRule.value?.let": "cssRule?.let",
              "htmlTag.value?.let": "htmlTag?.let",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if s != before:
              p.write_text(s, encoding="utf-8")
              print("BenResponsePolicy nullable lazy-Regex normalization: FIXED")
          else:
              print("BenResponsePolicy nullable lazy-Regex normalization: already correct")
          PY
          # Check actual Kotlin member-access lines, not the replacement-map string
          # literals above (those intentionally contain the old ".value" text).
          if grep -nE '^\\s*(styleBlock|scriptBlock|eventAttribute|styleAttribute|cssRule|htmlTag)\\.value' app/src/main/java/com/localqbank/library/BenResponsePolicy.kt; then
            echo "ERROR: stale BenResponsePolicy .value dereference remains."
            exit 1
          fi
      # The persisted source ZIP is authoritative. No historical repair scripts are replayed.
      # This prevents stale repair logic from mutating the uploaded verified source before build.

      - name: Verify project configuration and source audits
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          # Source ZIP uploads do not reliably preserve POSIX executable bits. Normalize
          # required repository scripts before asserting them executable.
          test -f tools/ruthless_audit.sh
          chmod +x tools/ruthless_audit.sh
          # Do not gate CI on the informational --version command. The project wrapper is a
          # pinned bootstrap launcher; Gradle itself can report version metadata while still
          # returning a non-zero status on this runner. Use a real Gradle configuration task
          # as the build-system health check so failures surface with actionable diagnostics.
          ./gradlew :app:tasks --all --no-daemon --stacktrace
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          grep -F 'com.localqbank.library' app/build.gradle.kts >/dev/null
          grep -E 'compileSdk[[:space:]]*=[[:space:]]*37' app/build.gradle.kts >/dev/null
          grep -F 'com.github.luben:zstd-jni:1.5.7-16@aar' app/build.gradle.kts >/dev/null
          test -x tools/ruthless_audit.sh
          ./tools/ruthless_audit.sh
          python3 tools/architecture_regression_audit.py
          echo "--- AMOLED source audit ---"
          python3 tools/amoled_ui_audit.py
          echo "--- performance/security source audit ---"
          python3 "${GITHUB_WORKSPACE}/tools/performance_security_audit.py"

      - name: Prepare persistent release signing configuration
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ROVEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          ROVEX_SIGNING_KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          ROVEX_SIGNING_STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          ROVEX_SIGNING_KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          ROVEX_SIGNING_KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_b64="${ROVEX_SIGNING_KEYSTORE_BASE64:-}"
          if [ -z "$keystore_b64" ]; then keystore_b64="${ROVEX_SIGNING_KEYSTORE_B64:-}"; fi
          test -n "$keystore_b64"
          test -n "${ROVEX_SIGNING_STORE_PASSWORD:-}"
          test -n "${ROVEX_SIGNING_KEY_ALIAS:-}"
          test -n "${ROVEX_SIGNING_KEY_PASSWORD:-}"
          keystore="$RUNNER_TEMP/rovex-release-signing.jks"
          printf '%s' "$keystore_b64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "ROVEX_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_STORE_PASSWORD=$ROVEX_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_ALIAS=$ROVEX_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_PASSWORD=$ROVEX_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$keystore" -storepass "$ROVEX_SIGNING_STORE_PASSWORD" -alias "$ROVEX_SIGNING_KEY_ALIAS" >/dev/null

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/rovex-unit-test.log"

      - name: Persist unit-test diagnostics on failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/rovex-unit-test.log"
          out="$RUNNER_TEMP/rovex-unit-test-diagnostics.txt"
          if [ -s "$src" ]; then
            grep -E '(^e: |error:|FAILURE:|Execution failed|Caused by:|Tests run:|FAILED|There were failing tests)' "$src" > "$out" || true
            if [ ! -s "$out" ]; then tail -n 250 "$src" > "$out"; fi
          else
            printf '%s\n' 'Unit-test log was not produced.' > "$out"
          fi
          printf '\n--- RUN %s / COMMIT %s ---\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" >> "$out"

      - name: Publish unit-test diagnostics to GitHub branch
        if: failure()
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_FILE: ${{ runner.temp }}/rovex-unit-test-diagnostics.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = process.env.DIAGNOSTIC_FILE;
            const content = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Diagnostic file missing';
            const branch = 'ci-diagnostics-' + context.runNumber;
            const { owner, repo } = context.repo;
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            try {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: mainRef.data.object.sha });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: 'ci-diagnostics/unit-test-' + context.runNumber + '.txt',
              message: 'ci: persist unit-test diagnostics ' + context.runNumber,
              content: Buffer.from(content, 'utf8').toString('base64'),
              branch
            });

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Verify zstd native library
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libzstd-jni-1.5.7-16.so' >/dev/null

      - name: Print release signing fingerprints
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'SHA-1 digest|SHA-256 digest'

      - name: Verify persistent Rovex signing certificate
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          expected_normalized='8DECBEAC906A40546B332F35629313EF6BA6860D1006AAD07B761538228C0153'
          actual=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':')
          echo "Actual certificate (normalized): $actual"
          test "$actual" = "$expected_normalized"

      - name: Verify Firebase Google Sign-In SHA-1 matches release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha1=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test -n "$release_sha1"
          python3 - "$release_sha1" <<'PYTHON'
          import json, sys
          sha1 = sys.argv[1].lower()
          with open('app/google-services.json', encoding='utf-8') as f:
              data = json.load(f)
          for client in data.get('client', []):
              android = client.get('client_info', {}).get('android_client_info', {})
              if android.get('package_name') != 'com.localqbank.library':
                  continue
              for oauth in client.get('oauth_client', []):
                  cert = oauth.get('android_info', {}).get('certificate_hash', '').replace(':', '').lower()
                  if oauth.get('client_type') == 1 and cert == sha1:
                      print('FIREBASE_RELEASE_SHA1=PASS')
                      raise SystemExit(0)
          raise SystemExit('Firebase google-services.json does not contain the release APK SHA-1 for com.localqbank.library.')
          PYTHON

      - name: Resolve release version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*=\([[:space:]]*\)\([0-9][0-9]*\).*/\2/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "ROVEX_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ROVEX_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Release identity: $VERSION_NAME ($VERSION_CODE)"

      - name: Package verified stable source ZIP
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          OUT="${ROOT}/Rovex_v${ROVEX_VERSION_NAME}_Final_Stability_Verified_Source.zip"
          rm -f "${ROOT}"/*.zip
          zip -q -r "${OUT}" . \
            -x './.gradle/*' './app/build/*' './build/*' './**/.DS_Store'
          test -s "${OUT}"
          unzip -tq "${OUT}"
          sha256sum "${OUT}"
          echo "VERIFIED_SOURCE_ZIP=${OUT}" >> "${GITHUB_ENV}"

      - name: Upload verified stable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-v${{ env.ROVEX_VERSION_NAME }}-Final-Stability-Verified-Source
          path: ${{ env.VERIFIED_SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified stable source ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f -iname '*.zip' -print | sort)
          test "${#zips[@]}" -eq 1
          git config user.name "Rovex Build Agent"
          git config user.email "rohitkokane9872@gmail.com"
          git add -- "${zips[0]}"
          if git diff --cached --quiet; then
            echo "Verified stable source ZIP already persisted."
          else
            git commit -m "chore: persist verified Rovex ${ROVEX_VERSION_NAME} source [skip ci]"
            # Another verified-source cleanup/build may have advanced main while this
            # workflow was building. Rebase our unique versioned ZIP commit before push
            # instead of failing on a harmless non-fast-forward race.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: unable to fast-forward verified source ZIP after 3 retries."
                exit 1
              fi
            done
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-UPDATE-v${{ env.ROVEX_VERSION_NAME }}-code${{ env.ROVEX_VERSION_CODE }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
