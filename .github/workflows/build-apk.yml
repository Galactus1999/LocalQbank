name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract LocalQBank project
        run: |
          set -e

          rm -rf android-project
          mkdir android-project

          unzip -q LocalQBank_PhoneBuild.zip -d android-project

          echo "Checking Android project..."

          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -d android-project/app

          echo "Project structure:"
          find android-project -maxdepth 3 -type f | sort

      - name: Build Debug APK
        working-directory: android-project
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalQBank_PhoneBuild
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
