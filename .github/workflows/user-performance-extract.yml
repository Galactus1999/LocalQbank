name: Rovex User Performance Extract
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"; mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          echo '=== PERFORMANCE MANAGER ==='
          cat "$p/app/src/main/java/com/localqbank/library/PerformanceManager.kt"
          echo '=== VIEW ==='
          cat "$p/app/src/main/java/com/localqbank/library/RovexPerformanceLabView.kt"
