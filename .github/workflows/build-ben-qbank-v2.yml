name: Build Ben QBank v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate workflow runner
        run: |
          set -euo pipefail
          echo "GitHub Actions bootstrap PASS"
          echo "Commit: $GITHUB_SHA"
          test -n "$GITHUB_WORKSPACE"
