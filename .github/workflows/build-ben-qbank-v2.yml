name: Build Ben QBank v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Rovex release validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Runner validation
        run: |
          set -euo pipefail
          java -version
          test -n "$ANDROID_HOME"
          echo "Runner/toolchain bootstrap PASS"
