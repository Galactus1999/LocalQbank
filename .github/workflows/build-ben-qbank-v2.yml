name: Build Ben QBank v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Rovex v8.3.293 release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-37" "platform-tools" "build-tools;35.0.0"
      - name: Extract v8.3.293 source
        shell: bash
        run: |
          set -euo pipefail
          zip="$GITHUB_WORKSPACE/Rovex_v8.3.293_AMOLED_Multiword_RootFix_Offline_Source.zip"
          test -s "$zip"
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q "$zip" -d "$RUNNER_TEMP/rovex"
          gradle_file="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$gradle_file"
          project_dir="$(dirname "$gradle_file")"
          test -f "$project_dir/gradlew"
          test -d "$project_dir/app"
          chmod +x "$project_dir/gradlew"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - name: Restore native QNN payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target="app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so"
          if [ -s "$target" ]; then exit 0; fi
          baseline="$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip"
          test -s "$baseline"
          tmp="$RUNNER_TEMP/qnn"
          rm -rf "$tmp" && mkdir -p "$tmp"
          unzip -q "$baseline" 'app/src/main/jniLibs/*' -d "$tmp"
          test -s "$tmp/app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so"
          mkdir -p app/src/main
          rm -rf app/src/main/jniLibs
          cp -a "$tmp/app/src/main/jniLibs" app/src/main/
          test -s "$target"
      - name: Normalize known compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
from pathlib import Path
import re
root=Path('app/src/main/java/com/localqbank/library')
for name in ['RenActivity.kt','BenResponsePolicy.kt','RovexFlashcardSummaryView.kt','RovexPerformanceLabView.kt','MainRepository.kt']:
    p=root/name
    if not p.exists(): continue
    s=p.read_text(encoding='utf-8')
    s=s.replace('Intent(this,QuizActivity::class.java)','Intent(this@RenActivity,QuizActivity::class.java)')
    s=s.replace('Intent(this, QuizActivity::class.java)','Intent(this@RenActivity, QuizActivity::class.java)')
    for x in ['styleBlock','scriptBlock','eventAttribute','styleAttribute','cssRule','htmlTag']:
        s=s.replace(x+'.value?.let',x+'?.let')
    s=s.replace('progress.globalResume()','db.getProgressMeta("last_resume_global").toString()')
    s=re.sub(r'\\.isFakeBold(?!Text)','.isFakeBoldText',s)
    if name=='RovexFlashcardSummaryView.kt' and 'import kotlin.math.sin' not in s:
        s=s.replace('import kotlin.math.min\n','import kotlin.math.min\nimport kotlin.math.sin\n')
    p.write_text(s,encoding='utf-8')
PY
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.293-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14