name: Build Ben QBank v2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Prepare source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.295_Ben_Fast_Table_Durability_Final.zip" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/tools/patch_296.py" "$d/patch_296.py"
          (cd "$d" && python3 patch_296.py && rm -f patch_296.py)
          cp "$GITHUB_WORKSPACE/tools/patch_297.py" "$d/patch_297.py"
          (cd "$d" && python3 patch_297.py && rm -f patch_297.py)
          cp "$GITHUB_WORKSPACE/tools/patch_298.py" "$d/patch_298.py"
          (cd "$d" && python3 patch_298.py && rm -f patch_298.py)
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*37/compileSdk = 36/g' "$d/app/build.gradle.kts"
          sed -i 's/fun read(match:String):List<SearchHit>=/fun read(match:String):List<SearchHit> =/' "$d/app/src/main/java/com/localqbank/library/QBankDb.kt"
          r="$d/app/src/main/java/com/localqbank/library/RenActivity.kt"
          grep -q 'import android.view.ViewGroup' "$r" || sed -i '/import android.view.View$/a import android.view.ViewGroup' "$r"
          q="$d/app/src/main/java/com/localqbank/library/QuizActivity.kt"
          sed -i 's/apply { tag=/apply { this.tag=/' "$q"
          sed -i 's/^                    tag = "quiz:" + role$/                    this.tag = "quiz:" + role/' "$q"
      - name: Verify v8.3.298 source
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/BenChatWebView.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizRichTextRenderer.kt"
          grep -q 'versionName = "8.3.298"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 392' "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenChatViewModel.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexAdaptiveUi.kt"
          grep -q 'chatState.webScrollY' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenActivity.kt"
          grep -q 'width:auto;min-width:100%' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenActivity.kt"
          grep -q 'ORIENTATION_LANDSCAPE' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/MainActivity.kt"
          grep -q 'android:resizeableActivity="true"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'isLandscape()).*d(44)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexSectionDashboardActivity.kt"
          grep -q 'RovexAdaptiveUi.apply(activity)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ResilienceManager.kt"
          grep -q 'OBSIDIAN_NIGHT' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ThemeManager.kt"
          ! grep -q 'AMOLED_DARK' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ThemeManager.kt"
          ! grep -q 'AMOLED Dark' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'requestDisallowInterceptTouchEvent(true)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/BenChatWebView.kt"
          grep -q 'scrollbar-gutter:stable' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenActivity.kt"
          grep -q 'table-layout:auto' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexMarkdown.kt"
          grep -q 'androidx.profileinstaller:profileinstaller:1.4.1' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'RovexAtomicFile.replace(temp, destination)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/BenNeuralModelManager.kt"
          grep -q 'RovexAtomicFile.replace(temp, file)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ApkgImporter.kt"
          grep -q 'frankensteinWorkspaceStartup' "$PROJECT_DIR/benchmark/src/main/kotlin/com/localqbank/library/benchmark/ColdStartupBenchmark.kt"
          ! grep -R -q 'catch (t: Throwable)' "$PROJECT_DIR/app/src/main/java"
      - name: Package v8.3.298 source under 25MB
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Rovex_v8.3.298_Final_Source.zip" . -x '.gradle/*' 'build/*' 'app/build/*'
          size=$(stat -c%s "$RUNNER_TEMP/Rovex_v8.3.297_Final_Source.zip")
          test "$size" -lt 25000000
      - name: Upload v8.3.298 source
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.298-source-under25mb
          path: ${{ runner.temp }}/Rovex_v8.3.297_Final_Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Gradle compatibility init
        run: |
          set -euo pipefail
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Restore native payload
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"
      - name: Release
        run: cd "$PROJECT_DIR" && ./gradlew :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Normalize release APK
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$out"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then cp -f "$apk" "$out/app-release.apk"; fi
          test -s "$out/app-release.apk"
      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - name: Verify
        run: |
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.298-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
