name: Build Ben QBank v2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'platform-tools' 'build-tools;35.0.0'
      - name: Extract
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.293_AMOLED_Multiword_RootFix_Offline_Source.zip" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          test -f "$d/gradlew"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
      - name: Native payload
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          test -s app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so || {
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn";
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn";
            rm -rf app/src/main/jniLibs;
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/;
          }
          test -s app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
      - name: Unit tests
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Release
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify
        run: |
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.293-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error