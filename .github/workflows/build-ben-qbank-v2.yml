name: Build Ben QBank v2

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rovex-release-build-v2
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" "platforms;android-37" "platform-tools" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Select and extract authoritative Rovex source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'Rovex_v*_Source.zip' -print)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "ERROR: no Rovex source ZIP found."
            exit 1
          fi
          selected="$(python3 - "${zips[@]}" <<'PY'
import re, sys
paths = sys.argv[1:]
def key(p):
    m = re.search(r'Rovex_v(\d+)\.(\d+)\.(\d+)', p)
    if not m:
        return (-1, -1, -1, 0, p)
    final = 1 if 'Final_Stability_Verified_Source.zip' in p else 0
    return (*map(int, m.groups()), final, p)
print(max(paths, key=key))
PY
)"
          echo "AUTHORITATIVE_SOURCE=$selected"
          rm -rf "$RUNNER_TEMP/rovex-source"
          mkdir -p "$RUNNER_TEMP/rovex-source"
          unzip -q "$selected" -d "$RUNNER_TEMP/rovex-source"
          root="$(find "$RUNNER_TEMP/rovex-source" -name settings.gradle.kts -type f -print -quit)"
          test -n "$root"
          project_dir="$(dirname "$root")"
          test -d "$project_dir/app"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Resolved Android project: $project_dir"

      - name: Restore verified native accelerator payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so ]; then exit 0; fi
          baseline="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'Rovex_v8.3.278_Final_Stability_Verified_Source.zip' -print -quit)"
          test -n "$baseline"
          tmp="$RUNNER_TEMP/rovex-baseline-native"
          rm -rf "$tmp"; mkdir -p "$tmp"
          unzip -q "$baseline" 'app/src/main/jniLibs/*' -d "$tmp"
          test -s "$tmp/app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so"
          rm -rf app/src/main/jniLibs
          cp -a "$tmp/app/src/main/jniLibs" app/src/main/
          echo "Verified native payload restored."

      - name: Normalize source compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
from pathlib import Path
import re
root = Path("app/src/main/java/com/localqbank/library")
p = root / "RenActivity.kt"
s = p.read_text(encoding="utf-8").replace("Intent(this,QuizActivity::class.java)", "Intent(this@RenActivity,QuizActivity::class.java)").replace("Intent(this, QuizActivity::class.java)", "Intent(this@RenActivity, QuizActivity::class.java)")
p.write_text(s, encoding="utf-8")
p = root / "BenResponsePolicy.kt"
s = p.read_text(encoding="utf-8")
for old, new in {"styleBlock.value?.let":"styleBlock?.let","scriptBlock.value?.let":"scriptBlock?.let","eventAttribute.value?.let":"eventAttribute?.let","styleAttribute.value?.let":"styleAttribute?.let","cssRule.value?.let":"cssRule?.let","htmlTag.value?.let":"htmlTag?.let"}.items():
    s = s.replace(old, new)
p.write_text(s, encoding="utf-8")
for name in ("RovexFlashcardSummaryView.kt","RovexPerformanceLabView.kt"):
    p = root / name
    s = re.sub(r"\.isFakeBold(?!Text)", ".isFakeBoldText", p.read_text(encoding="utf-8"))
    if name == "RovexFlashcardSummaryView.kt" and "import kotlin.math.sin" not in s:
        s = s.replace("import kotlin.math.min\n", "import kotlin.math.min\nimport kotlin.math.sin\n")
    p.write_text(s, encoding="utf-8")
p = root / "MainRepository.kt"
p.write_text(p.read_text(encoding="utf-8").replace("progress.globalResume()", 'db.getProgressMeta("last_resume_global").toString()'), encoding="utf-8")
print("Source compatibility normalization: PASS")
PY
          test -f ./gradlew
          chmod +x ./gradlew
          test -f settings.gradle.kts
          test -d app
          grep -F 'com.localqbank.library' app/build.gradle.kts >/dev/null
          grep -E 'compileSdk[[:space:]]*=[[:space:]]*37' app/build.gradle.kts >/dev/null
          grep -F 'com.github.luben:zstd-jni:1.5.7-16@aar' app/build.gradle.kts >/dev/null

      - name: Run source audits
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f tools/ruthless_audit.sh
          chmod +x tools/ruthless_audit.sh
          ./tools/ruthless_audit.sh
          python3 tools/architecture_regression_audit.py
          python3 tools/amoled_ui_audit.py
          python3 tools/performance_security_audit.py

      - name: Prepare persistent signing
        shell: bash
        env:
          ROVEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          ROVEX_SIGNING_KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          ROVEX_SIGNING_STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          ROVEX_SIGNING_KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          ROVEX_SIGNING_KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          b64="${ROVEX_SIGNING_KEYSTORE_BASE64:-}"
          [ -n "$b64" ] || b64="${ROVEX_SIGNING_KEYSTORE_B64:-}"
          test -n "$b64"
          test -n "${ROVEX_SIGNING_STORE_PASSWORD:-}"
          test -n "${ROVEX_SIGNING_KEY_ALIAS:-}"
          test -n "${ROVEX_SIGNING_KEY_PASSWORD:-}"
          ks="$RUNNER_TEMP/rovex-release-signing.jks"
          printf '%s' "$b64" | base64 --decode > "$ks"
          echo "ROVEX_SIGNING_STORE_FILE=$ks" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_STORE_PASSWORD=$ROVEX_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_ALIAS=$ROVEX_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ROVEX_SIGNING_KEY_PASSWORD=$ROVEX_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$ks" -storepass "$ROVEX_SIGNING_STORE_PASSWORD" -alias "$ROVEX_SIGNING_KEY_ALIAS" >/dev/null

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libzstd-jni-1.5.7-16.so' >/dev/null
          "$APKSIGNER" verify --print-certs "$apk"
          expected='8DECBEAC906A40546B332F35629313EF6BA6860D1006AAD07B761538228C0153'
          actual=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':')
          test "$actual" = "$expected"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-UPDATE-v8.3.293
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
