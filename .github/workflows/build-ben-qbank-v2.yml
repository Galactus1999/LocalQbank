name: Build Ben QBank v2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Prepare source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.294_Radical_AMOLED_Search_Footer_Offline_Final.zip" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*37/compileSdk = 36/g' "$d/app/build.gradle.kts"
          sed -i 's/fun read(match:String):List<SearchHit>=/fun read(match:String):List<SearchHit> =/' "$d/app/src/main/java/com/localqbank/library/QBankDb.kt"
      - name: Verify v8.3.294 source
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizRichTextRenderer.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ExperiencePerformanceManager.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenCognitiveEngine.kt"
          grep -q 'localSearchCommand' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ExperiencePerformanceManager.kt"
          grep -q 'db.search(variant, 180)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RenCognitiveEngine.kt"
          ! grep -q 'out.setSpan(ForegroundColorSpan' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizRichTextRenderer.kt"
          grep -q 'versionName = "8.3.294"' "$PROJECT_DIR/app/build.gradle.kts"
      - name: Package v8.3.294 source under 25MB
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Rovex_v8.3.294_Final_Source.zip" . -x '.gradle/*' 'build/*' 'app/build/*'
          size=$(stat -c%s "$RUNNER_TEMP/Rovex_v8.3.294_Final_Source.zip")
          echo "Final source ZIP bytes: $size"
          test "$size" -lt 25000000
      - name: Upload v8.3.294 source
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.294-source-under25mb
          path: ${{ runner.temp }}/Rovex_v8.3.294_Final_Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Gradle compatibility init
        run: |
          set -euo pipefail
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Restore native payload
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"
      - name: Release
        run: cd "$PROJECT_DIR" && ./gradlew :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Normalize release APK
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$out"
          ls -la "$out"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then
            cp -f "$apk" "$out/app-release.apk"
          fi
          test -s "$out/app-release.apk"
      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"

      - name: Verify
        run: |
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.294-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error