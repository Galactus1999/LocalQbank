name: Apply Rovex Minimal Frankenstein UI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
          test "${#zips[@]}" -eq 1
          old="${zips[0]}"
          rm -rf work
          mkdir work
          unzip -q "$old" -d work
          project="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          test -f "$project/app/src/main/java/com/localqbank/library/RenActivity.kt"
          python3 - "$project" <<'PY'
          from pathlib import Path
          import re, sys, shutil

          project = Path(sys.argv[1])
          ren = project / "app/src/main/java/com/localqbank/library/RenActivity.kt"
          s = ren.read_text(encoding="utf-8")

          header_start = s.index("        val header = LinearLayout(this)")
          header_end = s.index("        root.addView(header)", header_start) + len("        root.addView(header)")
          s = s[:header_start] + new_header + s[header_end:]

          status_start = s.index("        val modelPill = TextView(this)")
          context_add = s.index("        contextCard = buildFrankensteinContextCard()", status_start)
          status_end = s.index("        root.addView(contextCard", context_add) + len(s[s.rfind("        root.addView(contextCard", context_add):s.index("\n", s.rfind("        root.addView(contextCard", context_add)) if "\n" in s[s.rfind("        root.addView(contextCard", context_add):] else len(s)])
          # Replace the whole model/diagnostic/context block up to the end of the context-card add line.
          line_end = s.index("\n", s.index("        root.addView(contextCard", context_add)) + 1
          s = s[:status_start] + new_status + s[line_end:]

          start = s.index("    private fun buildFrankensteinContextCard(): LinearLayout {")
          end = s.index("    private fun currentPromptForContext(): String", start)
          compact = '''    private fun buildFrankensteinContextCard(): LinearLayout {
              val row = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
              }
              fun chip(label: String, action: () -> Unit): TextView = TextView(this).apply {
                  text = label
                  textSize = 9f
                  gravity = Gravity.CENTER
                  setTextColor(ThemeManager.text(this@RenActivity))
                  background = UiDrawableUtils.roundedDrawable(this@RenActivity, ThemeManager.elevated(this@RenActivity), 9f)
                  setPadding(dp(4), 0, dp(4), 0)
                  minHeight = 0
                  setOnClickListener { action() }
              }
              val inspect = chip("INSPECT") {
                  val prompt = currentPromptForContext()
                  if (prompt.isBlank()) Toast.makeText(this, "Enter a topic first", Toast.LENGTH_SHORT).show()
                  else showFrankensteinContext(prompt)
              }
              val local = chip("LOCAL") { showFrankensteinContext(currentPromptForContext()) }
              val weak = chip("WEAKNESS") { showWeaknessContext() }
              row.addView(inspect, LinearLayout.LayoutParams(0, dp(30), 1f).apply { setMargins(0, 0, dp(4), 0) })
              row.addView(local, LinearLayout.LayoutParams(0, dp(30), 1f).apply { setMargins(0, 0, dp(4), 0) })
              row.addView(weak, LinearLayout.LayoutParams(0, dp(30), 1f))
              return row
          }

          '''
          s = s[:start] + compact + s[end:]

          s = s.replace('text="Local Ben first • EmbeddingGemma retrieval • Gemma 3 270M generation • optional Free AI"', 'text="Ready"', 1)
          s = s.replace('textSize=16f; setTextColor(ThemeManager.text(this@RenActivity)); setPadding(dp(18),dp(18),dp(18),dp(20))',
                        'textSize=17f; setTextColor(ThemeManager.text(this@RenActivity)); setPadding(dp(14),dp(14),dp(14),dp(16))', 1)
          s = s.replace('root.addView(input, LinearLayout.LayoutParams(-1,dp(78)).apply{setMargins(0,dp(2),0,dp(8))})',
                        'root.addView(input, LinearLayout.LayoutParams(-1,dp(68)).apply{setMargins(0,dp(2),0,dp(6))})', 1)
          s = s.replace('root.addView(core,LinearLayout.LayoutParams(-1,dp(52)).apply{setMargins(0,dp(2),0,dp(7))})',
                        'root.addView(core,LinearLayout.LayoutParams(-1,dp(42)).apply{setMargins(0,dp(2),0,dp(5))})', 1)
          s = s.replace('LinearLayout.LayoutParams(dp(78),dp(46))','LinearLayout.LayoutParams(dp(76),dp(36))',1)
          s = s.replace('LinearLayout.LayoutParams(0,dp(46),1f)','LinearLayout.LayoutParams(0,dp(36),1f)',1)
          s = s.replace('LinearLayout.LayoutParams(dp(78),dp(46))','LinearLayout.LayoutParams(dp(76),dp(36))',1)
          s = s.replace('LinearLayout.LayoutParams(dp(72),dp(46))','LinearLayout.LayoutParams(dp(72),dp(36))',1)
          ren.write_text(s, encoding="utf-8")

          gradle = project / "app/build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          m = re.search(r'versionName\\s*=\\s*"([0-9]+\\.[0-9]+\\.[0-9]+)"', g)
          c = re.search(r'versionCode\\s*=\\s*([0-9]+)', g)
          if not (m and c): raise SystemExit("Could not find versionName/versionCode")
          oldv, oldc = m.group(1), int(c.group(1))
          if oldv != "8.3.263" or oldc != 357:
              raise SystemExit(f"Unexpected baseline version {oldv} ({oldc}); refusing to patch")
          g = g[:m.start(1)] + "8.3.264" + g[m.end(1):]
          # re-find code after version replacement
          c2 = re.search(r'versionCode\\s*=\\s*([0-9]+)', g)
          g = g[:c2.start(1)] + "358" + g[c2.end(1):]
          gradle.write_text(g, encoding="utf-8")

          # Use the uploaded logo's visual design as a launcher-safe vector: black field with the
          # same concentric/interlocking emblem motif and ROVEX wordmark silhouette.
          res = project / "app/src/main/res/drawable"
          res.mkdir(parents=True, exist_ok=True)
          (res / "rovex_launcher.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#E8E8E8" android:pathData="M54,16c-19,0 -35,16 -35,35s16,35 35,35c7,0 13,-2 18,-6c-3,-2 -5,-5 -6,-8c-4,3 -8,4 -12,4c-14,0 -25,-11 -25,-25s11,-25 25,-25c5,0 10,2 14,5l6,-6c-6,-6 -13,-9 -20,-9z"/>
              <path android:fillColor="#BDBDBD" android:pathData="M54,27c-13,0 -24,11 -24,24s11,24 24,24c5,0 10,-2 14,-5l-5,-7c-3,2 -6,3 -9,3c-9,0 -16,-7 -16,-15s7,-16 16,-16c3,0 6,1 9,3l5,-7c-4,-3 -9,-4 -14,-4z"/>
              <path android:fillColor="#E8E8E8" android:pathData="M54,37c-8,0 -14,6 -14,14s6,14 14,14s14,-6 14,-14s-6,-14 -14,-14zM54,44c4,0 7,3 7,7s-3,7 -7,7s-7,-3 -7,-7s3,-7 7,-7z"/>
              <path android:fillColor="#F2F2F2" android:pathData="M60,16c8,4 14,12 14,22c0,7 -3,13 -8,17l-6,-6c3,-3 5,-7 5,-11c0,-6 -3,-11 -8,-14z"/>
          </vector>''', encoding="utf-8")

          for mf in project.glob("app/src/main/AndroidManifest.xml"):
              ms = mf.read_text(encoding="utf-8")
              ms2 = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rovex_launcher"', ms, count=1)
              ms2 = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rovex_launcher"', ms2, count=1)
              if ms2 == ms:
                  raise SystemExit("Launcher icon attributes not found in AndroidManifest.xml")
              mf.write_text(ms2, encoding="utf-8")

          # Hard checks against the requested minimal UI.
          final = ren.read_text(encoding="utf-8")
          for forbidden in ("text=\"Dr. Frankenstein\"", "text=\"Local study intelligence\"", "BEN ROUTER", "CHAT MEMORY"):
              if forbidden in final:
                  raise SystemExit("Minimal UI check failed: " + forbidden)
          for required in ("text = \"MODEL LAB\"", "buildFrankensteinContextCard()", "Free AI will answer."):
              if required not in final:
                  raise SystemExit("Required UI/flow marker missing: " + required)
          print(f"Patched RenActivity and launcher: 8.3.263/{357} -> 8.3.264/{358}")

          PY

          new="Rovex_v8_3_264_Frankenstein_Minimal_UI_Launcher_Source.zip"
          rm -f "$new"
          (cd work && zip -qr "../$new" .)
          unzip -tq "$new"
          sha256sum "$new"
          rm -f "$old"
          git rm -f --ignore-unmatch "$(basename "$old")"
          git add "$new"
          git rm -f --ignore-unmatch .github/workflows/inspect-frankenstein.yml .github/workflows/apply-frankenstein-ui.yml
          git config user.name "Rovex Build Agent"
          git config user.email "rohitkokane9872@gmail.com"
          git commit -m "feat: minimal Frankenstein UI and new Rovex launcher"
          git push

      - name: Trigger authoritative Android build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-apk.yml --ref main
