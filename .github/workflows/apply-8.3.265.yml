name: Apply Rovex 8.3.265 UX AI Speed Patch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
          test "${#zips[@]}" -eq 1
          old="${zips[0]}"
          rm -rf work && mkdir work
          unzip -q "$old" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          test -n "$p"

          python3 - "$p" <<'PY'
          from pathlib import Path
          import re, sys

          p=Path(sys.argv[1])
          ren=p/"app/src/main/java/com/localqbank/library/RenActivity.kt"
          main=p/"app/src/main/java/com/localqbank/library/MainActivity.kt"
          xml=p/"app/src/main/res/layout/activity_main.xml"
          perf=p/"app/src/main/java/com/localqbank/library/RovexPerformanceLabView.kt"
          gateway=p/"app/src/main/java/com/localqbank/library/BenCloudAiGateway.kt"

          # ---------- Frankenstein: content first, no diagnostic clutter ----------
          s=ren.read_text()
          hs=s.index("        val header = LinearLayout(this)")
          he=s.index("        root.addView(header)",hs)+len("        root.addView(header)")
          header='''        val header = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
          }
          header.addView(TextView(this).apply {
              text = "‹"; textSize = 30f; gravity = Gravity.CENTER
              setTextColor(ThemeManager.text(this@RenActivity))
              setOnClickListener { finish() }
          }, LinearLayout.LayoutParams(dp(40), dp(42)))
          header.addView(Space(this), LinearLayout.LayoutParams(0, 1, 1f))
          val freeAi = TextView(this).apply {
              text = "FREE AI"; textSize = 10f; typeface = Typeface.DEFAULT_BOLD
              gravity = Gravity.CENTER
              setTextColor(ThemeManager.text(this@RenActivity))
              background = UiDrawableUtils.roundedDrawable(this@RenActivity, ThemeManager.elevated(this@RenActivity), 10f)
              setPadding(dp(9), 0, dp(9), 0)
              contentDescription = "Select Free AI provider"
              setOnClickListener { showFreeAiMenu() }
          }
          header.addView(freeAi, LinearLayout.LayoutParams(dp(78), dp(42)).apply { setMargins(0,0,dp(5),0) })
          val lab = TextView(this).apply {
              text = "MODEL LAB"; textSize = 10f; typeface = Typeface.DEFAULT_BOLD
              gravity = Gravity.CENTER
              setTextColor(ThemeManager.text(this@RenActivity))
              background = UiDrawableUtils.roundedDrawable(this@RenActivity, ThemeManager.elevated(this@RenActivity), 10f)
              setPadding(dp(9),0,dp(9),0)
              setOnClickListener { startActivity(Intent(this@RenActivity, BenModelLabActivity::class.java)) }
          }
          header.addView(lab, LinearLayout.LayoutParams(dp(94), dp(42)))
          root.addView(header)'''
          s=s[:hs]+header+s[he:]

          # Remove the visible context/diagnostic strip; keep underlying methods for internal use.
          s=re.sub(r'        contextCard = buildFrankensteinContextCard\(\)\n        root\.addView\(contextCard,[^\n]+\)\n', '', s, count=1)
          s=re.sub(r'        root\.addView\(liveStatus, LinearLayout\.LayoutParams\(-1,dp\(28\)\)\)\n',
                   '        liveStatus.visibility = View.GONE\n', s, count=1)

          # Replace the oversized action footer with exactly three compact actions.
          start=s.index('        val core = TextView(this)')
          end=s.index('        root.addView(row)', start)+len('        root.addView(row)')
          footer='''        fun actionButton(label: String, click: () -> Unit): TextView = TextView(this).apply {
              text = label; textSize = 11.5f; gravity = Gravity.CENTER
              setTextColor(ThemeManager.text(this@RenActivity))
              background = UiDrawableUtils.roundedDrawable(this@RenActivity, ThemeManager.elevated(this@RenActivity), 11f)
              setPadding(dp(4),0,dp(4),0)
              setOnClickListener { click() }
          }
          val row = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
          }
          row.addView(actionButton("Dr.F") { respond(input, answer, modelPill) },
              LinearLayout.LayoutParams(0,dp(38),1f).apply{setMargins(0,0,dp(5),0)})
          row.addView(actionButton("Dr.F + AI") { runCombinedCore(input, answer, modelPill) },
              LinearLayout.LayoutParams(0,dp(38),1f).apply{setMargins(0,0,dp(5),0)})
          row.addView(actionButton("G.search") {
              startActivity(Intent(this@RenActivity, GoogleSearchActivity::class.java))
          }, LinearLayout.LayoutParams(0,dp(38),1f))
          root.addView(row)'''
          s=s[:start]+footer+s[end:]

          # Smaller composer; preserve answer area as the dominant pane.
          s=s.replace('LinearLayout.LayoutParams(-1,dp(68)).apply{setMargins(0,dp(2),0,dp(6))}',
                      'LinearLayout.LayoutParams(-1,dp(62)).apply{setMargins(0,dp(2),0,dp(5))}',1)

          # Prevent AI from displaying CSS/style payloads as answer text.
          marker='    private fun currentPromptForContext(): String'
          clean='''    private fun cleanAiAnswer(raw: String): String {
              var x = raw.replace(Regex("(?is)<style[^>]*>.*?</style>"), "")
              x = x.replace(Regex("(?is)<script[^>]*>.*?</script>"), "")
              val cssLike = Regex("(?s)(?:body|h[1-6]|p|blockquote|code,pre|pre|table|th,td)\\s*\\{[^}]*\\}")
              if (cssLike.find(x.take(5000)) != null) x = cssLike.replace(x, "")
              x = x.replace(Regex("(?m)^\\s*(?:font-family|font-size|line-height|margin|padding|color|background|border(?:-[a-z]+)?)\\s*:[^\\n}]+[;}]?\\s*$"), "")
              return x.replace(Regex("\\n{3,}"), "\\n\\n").trim()
          }

'''
          if 'private fun cleanAiAnswer' not in s:
              s=s.replace(marker,clean+marker,1)

          s=s.replace('answer.text=rovexMarkdownToSpanned(insight.body)',
                      'answer.text=rovexMarkdownToSpanned(cleanAiAnswer(insight.body))')
          s=s.replace('maxTokens=1600',
                      'maxTokens=900,timeoutMs=9_000L')
          s=s.replace('answer.text=rovexMarkdownToSpanned(result.text)',
                      'answer.text=rovexMarkdownToSpanned(cleanAiAnswer(result.text))')

          ren.write_text(s)

          # ---------- User performance, not device health ----------
          newperf='''package com.localqbank.library

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.roundToInt

          /** Compact home widget showing the learner's study performance, never device health. */
          class RovexPerformanceLabView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private var accuracy = 0
              private var solved = 0
              private var wrong = 0

              fun setUserStats(accuracy: Int, solved: Int, wrong: Int) {
                  this.accuracy = accuracy.coerceIn(0,100)
                  this.solved = solved.coerceAtLeast(0)
                  this.wrong = wrong.coerceAtLeast(0)
                  invalidate()
              }

              // Compatibility shim for older callers; deliberately maps to learner metrics.
              fun setScores(a: Int, s: Int, w: Int) = setUserStats(a,s,w)

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val d=resources.displayMetrics.density
                  val w=width.toFloat(); val h=height.toFloat()
                  if(w<=0f || h<=0f) return
                  val dark=ThemeManager.isDark(context)
                  val accent=ThemeManager.accent(context)
                  p.style=Paint.Style.FILL
                  p.color=ThemeManager.panel(context)
                  c.drawRoundRect(0f,0f,w,h,16*d,16*d,p)

                  val left=12*d; val right=w-12*d
                  p.color=ThemeManager.text(context); p.textAlign=Paint.Align.LEFT
                  p.textSize=10.5f*d; p.isFakeBoldText=true
                  c.drawText("YOUR PERFORMANCE",left,17*d,p)
                  p.isFakeBoldText=false
                  p.color=ThemeManager.muted(context); p.textSize=8*d
                  c.drawText("$solved solved  •  $wrong wrong",left,30*d,p)

                  val cy=59*d; val r=20*d
                  p.style=Paint.Style.STROKE; p.strokeWidth=5*d; p.strokeCap=Paint.Cap.ROUND
                  p.color=if(dark)0xFF27343D.toInt() else 0xFFE0E8EB.toInt()
                  c.drawCircle(left+r,cy,r,p)
                  p.color=accent
                  c.drawArc(left,cy-r,left+2*r,cy+r,-90f,accuracy*3.6f,false,p)
                  p.style=Paint.Style.FILL; p.textAlign=Paint.Align.CENTER
                  p.color=ThemeManager.text(context); p.textSize=12*d; p.isFakeBoldText=true
                  c.drawText("$accuracy%",left+r,cy+4*d,p)
                  p.isFakeBoldText=false
                  p.textSize=8*d; p.color=ThemeManager.muted(context)
                  c.drawText("ACCURACY",left+r,cy+31*d,p)

                  p.textAlign=Paint.Align.LEFT
                  p.color=ThemeManager.muted(context); p.textSize=8.5f*d
                  c.drawText("Study accuracy",w*0.48f,51*d,p)
                  p.color=accent
                  c.drawRoundRect(w*0.48f,57*d,right,63*d,3*d,3*d,p)
                  p.color=if(dark)0xFF26343C.toInt() else 0xFFE2EAED.toInt()
                  c.drawRoundRect(w*0.48f,69*d,right,75*d,3*d,3*d,p)
                  p.color=ThemeManager.muted(context)
                  c.drawText("Wrong",w*0.48f,84*d,p)
                  p.color=0xFFD65F5F.toInt()
                  c.drawRoundRect(w*0.68f,78*d,right,84*d,3*d,3*d,p)
              }
          }
          '''
          perf.write_text(newperf)

          # Bind the widget to actual learner progress once, off the UI thread.
          ms=main.read_text()
          if 'refreshUserPerformanceLab()' not in ms:
              m=re.search(r'\bsetContentView\([^\n]+\)',ms)
              if not m: raise SystemExit("MainActivity setContentView not found")
              ms=ms[:m.end()]+'''\n        refreshUserPerformanceLab()'''+ms[m.end():]
              insert='''

          private fun refreshUserPerformanceLab() {
              PerformanceManager.submit {
                  val refs = PerformanceManager.lightRefs(applicationContext)
                  val progress = PerformanceManager.progress(applicationContext)
                  var solved = 0
                  var correct = 0
                  var wrong = 0
                  refs.forEach { ref ->
                      when (progress.record(ref.stableKey)?.status) {
                          "correct" -> { solved++; correct++ }
                          "wrong" -> { solved++; wrong++ }
                      }
                  }
                  val accuracy = if (solved == 0) 0 else (correct * 100 / solved)
                  runOnUiThread {
                      findViewById<RovexPerformanceLabView>(R.id.performanceLabViz)?.setUserStats(accuracy, solved, wrong)
                  }
              }
          }
          '''
              val pos=ms.lastIndexOf('\n}')
              ms=ms.substring(0,pos)+insert+ms.substring(pos)
          main.write_text(ms)

          # ---------- Home: compact adaptive header and graphical widgets ----------
          x=xml.read_text()
          x=x.replace('android:layout_height="104dp"','android:layout_height="76dp"',1)
          x=re.sub(r'\s*<com\.localqbank\.library\.RovexHeaderTitanicView[^>]*/>', '''
          <com.localqbank.library.RovexHeaderCosmicView
              android:id="@+id/headerCosmic"
              android:layout_width="96dp"
              android:layout_height="68dp"
              android:layout_gravity="end|center_vertical"
              android:clickable="false"
              android:focusable="false"
              android:importantForAccessibility="no" />''', x, count=1)
          x=x.replace('android:layout_width="118dp" android:layout_height="96dp"','android:layout_width="104dp" android:layout_height="78dp"',1)
          x=x.replace('android:layout_width="158dp" android:layout_height="128dp"','android:layout_width="126dp" android:layout_height="86dp"',1)
          x=re.sub(r'android:text="Search[^"]*"', 'android:text="Search QBanks • sections • questions"', x, count=1)
          xml.write_text(x)

          # ---------- Cosmic end-cap: Earth behind a small spacecraft ----------
          cosmic=p/"app/src/main/java/com/localqbank/library/RovexHeaderCosmicView.kt"
          cosmic.write_text('''package com.localqbank.library

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.sin

          class RovexHeaderCosmicView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {
              private val p=Paint(Paint.ANTI_ALIAS_FLAG)
              private var phase=0f
              override fun onDraw(c:Canvas) {
                  val d=resources.displayMetrics.density
                  val w=width.toFloat(); val h=height.toFloat()
                  if(w<=0 || h<=0) return
                  p.style=Paint.Style.FILL
                  p.color=if(ThemeManager.isDark(context))0xFF080A16.toInt() else 0xFFF2F5F8.toInt()
                  c.drawRect(0f,0f,w,h,p)
                  val ex=w*0.72f; val ey=h*0.57f; val er=minOf(w,h)*0.31f
                  p.shader=RadialGradient(ex-er*0.35f,ey-er*0.4f,er,
                      intArrayOf(0xFF65B9FF.toInt(),0xFF176AA5.toInt(),0xFF0B3156.toInt()),null,Shader.TileMode.CLAMP)
                  c.drawCircle(ex,ey,er,p); p.shader=null
                  p.color=0xFF3F9D62.toInt()
                  c.drawOval(ex-er*0.45f,ey-er*0.15f,ex+er*0.05f,ey+er*0.28f,p)
                  c.drawOval(ex+er*0.02f,ey-er*0.55f,ex+er*0.45f,ey-er*0.05f,p)
                  // Small spacecraft in front of Earth.
                  phase += 0.035f
                  val sx=w*0.36f; val sy=h*(0.35f+0.04f*sin(phase))
                  p.color=ThemeManager.text(context)
                  val path=Path().apply{moveTo(sx-16*d,sy+5*d);lineTo(sx+10*d,sy);lineTo(sx-5*d,sy+10*d);close()}
                  c.drawPath(path,p)
                  p.color=ThemeManager.accent(context)
                  c.drawCircle(sx-3*d,sy+4*d,2*d,p)
                  postInvalidateOnAnimation()
              }
          }
          ''')

          # ---------- Remove Titanic implementation from active source ----------
          (p/"app/src/main/java/com/localqbank/library/RovexHeaderTitanicView.kt").unlink(missing_ok=True)

          # ---------- Settings: imported PDF library access ----------
          settings=p/"app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          st=settings.read_text()
          if 'BenPdfLibraryActivity' not in st:
              anchor='startActivity(Intent(activity, BenPdfImportActivity::class.java))'
              repl='''startActivity(Intent(activity, BenPdfImportActivity::class.java))'''
              # Add a separate compact library entry immediately after the importer entry.
              idx=st.find(anchor)
              if idx<0: raise SystemExit("PDF import entry not found")
              line_end=st.find('\n',idx)
              addition='''\n                menu.add("Imported PDFs", "Open and manage reference PDFs already imported for Ben") {
                    activity.startActivity(Intent(activity, BenPdfLibraryActivity::class.java))
                }'''
              st=st[:line_end]+addition+st[line_end:]
              settings.write_text(st)

          pdf=p/"app/src/main/java/com/localqbank/library/BenPdfLibraryActivity.kt"
          pdf.write_text('''package com.localqbank.library

          import android.app.Activity
          import android.graphics.BitmapFactory
          import android.graphics.pdf.PdfRenderer
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import android.view.Gravity
          import android.widget.*
          import java.io.File

          class BenPdfLibraryActivity : Activity() {
              private val store by lazy { BenPdfResearchStore(this) }
              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  val root=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(18,14,18,18)}
                  val header=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL}
                  header.addView(TextView(this).apply{text="‹";textSize=30f;setOnClickListener{finish()}},LinearLayout.LayoutParams(42,48))
                  header.addView(TextView(this).apply{text="Imported PDFs";textSize=20f;setTypeface(null,android.graphics.Typeface.BOLD)},LinearLayout.LayoutParams(0,48,1f))
                  root.addView(header)
                  val list=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL}
                  val scroll=ScrollView(this);scroll.addView(list)
                  root.addView(scroll,LinearLayout.LayoutParams(-1,0,1f))
                  setContentView(root)
                  refresh(list)
              }
              private fun refresh(list:LinearLayout){
                  list.removeAllViews()
                  val dir=File(filesDir,"ben_pdf_corpus")
                  val files=dir.listFiles{f->f.extension.equals("pdf",true)}?.sortedByDescending{it.lastModified()}.orEmpty()
                  if(files.isEmpty()){list.addView(TextView(this).apply{text="No PDFs imported yet.";textSize=15f;setPadding(8,22,8,22)});return}
                  files.forEach{pdf->
                      val row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL}
                      row.addView(TextView(this).apply{
                          text=pdf.name.substringAfter("_").removeSuffix(".pdf").replace("_"," ")
                          textSize=14f;setTextColor(ThemeManager.text(this@BenPdfLibraryActivity))
                      },LinearLayout.LayoutParams(0,58,1f))
                      val open=TextView(this).apply{text="OPEN";textSize=11f;gravity=Gravity.CENTER;setPadding(12,0,12,0);setOnClickListener{preview(pdf)}}
                      row.addView(open,LinearLayout.LayoutParams(70,44))
                      val del=TextView(this).apply{text="DELETE";textSize=10f;gravity=Gravity.CENTER;setOnClickListener{
                          pdf.delete();File(pdf.parentFile,pdf.nameWithoutExtension+".txt").delete();refresh(list)
                      }}
                      row.addView(del,LinearLayout.LayoutParams(70,44))
                      list.addView(row)
                  }
              }
              private fun preview(pdf:File){
                  val dlg=android.app.Dialog(this)
                  val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(8,8,8,8)}
                  val title=TextView(this).apply{text=pdf.name;textSize=13f;setPadding(8,8,8,8)}
                  val image=ImageView(this).apply{adjustViewBounds=true}
                  var page=0
                  fun render(){
                      runCatching{
                          ParcelFileDescriptor.open(pdf,ParcelFileDescriptor.MODE_READ_ONLY).use{pfd->
                              PdfRenderer(pfd).use{r->r.openPage(page).use{pg->
                                  val bmp=android.graphics.Bitmap.createBitmap(pg.width,pg.height,android.graphics.Bitmap.Config.ARGB_8888)
                                  pg.render(bmp,null,null,PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);image.setImageBitmap(bmp)
                              }}
                          }
                      }
                  }
                  val controls=LinearLayout(this).apply{gravity=Gravity.CENTER}
                  val prev=TextView(this).apply{text="‹";textSize=26f;setPadding(20,4,20,4);setOnClickListener{if(page>0){page--;render()}}}
                  val next=TextView(this).apply{text="›";textSize=26f;setPadding(20,4,20,4);setOnClickListener{
                      val n=runCatching{ParcelFileDescriptor.open(pdf,ParcelFileDescriptor.MODE_READ_ONLY).use{pfd->PdfRenderer(pfd).use{it.pageCount}}}.getOrDefault(page+1)
                      if(page+1<n){page++;render()}
                  }}
                  controls.addView(prev);controls.addView(next)
                  box.addView(title);box.addView(image,LinearLayout.LayoutParams(-1,0,1f));box.addView(controls)
                  dlg.setContentView(box);dlg.window?.setLayout(-1,-1);dlg.show();render()
              }
          }
          ''')

          # ---------- Version ----------
          grad=p/"app/build.gradle.kts"; g=grad.read_text()
          m=re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"',g); c=re.search(r'versionCode\s*=\s*([0-9]+)',g)
          if not m or not c or m.group(1)!="8.3.264" or int(c.group(1))!=358:
              raise SystemExit("Unexpected baseline; refusing patch")
          g=g[:m.start(1)]+"8.3.265"+g[m.end(1):]
          c2=re.search(r'versionCode\s*=\s*([0-9]+)',g); g=g[:c2.start(1)]+"359"+g[c2.end(1):]
          grad.write_text(g)

          # ---------- Faster cloud path ----------
          gs=gateway.read_text()
          gs=gs.replace('suspend fun generate(prompt: String, system: String = DEFAULT_SYSTEM, maxTokens: Int = 1200, timeoutMs: Long = 35_000L)',
                        'suspend fun generate(prompt: String, system: String = DEFAULT_SYSTEM, maxTokens: Int = 900, timeoutMs: Long = 9_000L)')
          gs=gs.replace('val ordered = configs().filter { it.enabled && it.hasKey }',
                        'val priority = listOf(Provider.OPENROUTER, Provider.GROQ, Provider.DEEPSEEK)\n        val ordered = priority.mapNotNull { p -> configs().firstOrNull { it.provider == p && it.enabled && it.hasKey } }')
          gs=gs.replace('readTimeout = 30_000','readTimeout = 8_000')
          gs=gs.replace('connectTimeout = 12_000','connectTimeout = 5_000')
          gs=gs.replace('put("stream", false)','put("stream", false)')
          gateway.write_text(gs)

          # ---------- Manifest ----------
          manifest=p/"app/src/main/AndroidManifest.xml"
          mm=manifest.read_text()
          if 'BenPdfLibraryActivity' not in mm:
              mm=mm.replace('</application>','<activity android:name=".BenPdfLibraryActivity" />\n        </application>',1)
          if 'RovexHeaderCosmicView' not in mm: pass
          manifest.write_text(mm)

          # ---------- Remove temporary audit workflows ----------
          wf=p.parent.parent/".github/workflows"
          # p is extracted project root, repo workflow dir is outside extracted project; handle repo separately below.
          print("PATCH COMPLETE 8.3.265/359")
          PY

          # Remove temporary workflow files from repository, but keep the authoritative build workflow.
          find .github/workflows -maxdepth 1 -type f \( -name '*audit*.yml' -o -name '*extract*.yml' -o -name 'apply-frankenstein-ui.yml' \) -print -delete || true

          new="Rovex_v8_3_265_Minimal_UI_User_Performance_FastAI_PDF_Library_Source.zip"
          rm -f "$new"
          (cd work && zip -qr "../$new" .)
          unzip -tq "$new"
          sha256sum "$new"
          git rm -f --ignore-unmatch "$(basename "$old")"
          git add "$new"
          git config user.name "Rovex Build Agent"
          git config user.email "rohitkokane9872@gmail.com"
          git add -A .github/workflows
          git commit -m "feat: minimal home UX user performance fast AI and PDF library"
          git push
