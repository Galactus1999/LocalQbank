name: Rovex Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare source
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q Rovex_v8.3.304_SectionDashboardCompileRepair.zip -d "$RUNNER_TEMP/rovex"
          sed -i 's/compileSdk = 36/compileSdk = 37/' "$RUNNER_TEMP/rovex/app/build.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/rovex" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/rovex/settings.gradle.kts"
          test -f "$RUNNER_TEMP/rovex/gradlew"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Build release
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-8.3.304-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
