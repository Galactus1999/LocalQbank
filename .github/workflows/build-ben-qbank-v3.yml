name: OFFLINE UPLOAD BUILD - Rovex
on:
  push:
    branches: [main]
    paths:
      - 'Rovex_LATEST_UPLOAD.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Prepare exact uploaded source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          src="$GITHUB_WORKSPACE/Rovex_LATEST_UPLOAD.zip"
          test -s "$src"
          unzip -q "$src" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$(sha256sum "$src" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Audit uploaded source
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'applicationId = "com.localqbank.library"' "$PROJECT_DIR/app/build.gradle.kts"
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$PROJECT_DIR/app/build.gradle.kts" | head -1)"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$PROJECT_DIR/app/build.gradle.kts" | head -1)"
          test -n "$version"; test -n "$code"
          echo "Uploaded source: v$version ($code)"
          echo "SHA-256: $SOURCE_SHA256"
          python3 - "$PROJECT_DIR" <<'PY'
import pathlib,sys,xml.etree.ElementTree as ET
root=pathlib.Path(sys.argv[1])
for p in root.glob("app/src/main/res/layout/*.xml"):
    tree=ET.parse(p)
    ids=[]
    for e in tree.iter():
        v=e.attrib.get("{http://schemas.android.com/apk/res/android}id","")
        if v.startswith("@+id/"): ids.append(v[5:])
    if len(ids)!=len(set(ids)): raise SystemExit(f"duplicate id in one layout: {p}")
print("XML_LAYOUT_AUDIT=PASS")
PY
      - name: Verify source ZIP size
        run: test "$(stat -c%s "$GITHUB_WORKSPACE/Rovex_LATEST_UPLOAD.zip")" -lt 25000000
      - name: Upload exact source used
        uses: actions/upload-artifact@v4
        with:
          name: Rovex-LATEST-source-under25mb
          path: \${{ github.workspace }}/Rovex_LATEST_UPLOAD.zip
          if-no-files-found: error
          retention-days: 30
      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false
      - name: Prepare Gradle compatibility init
        run: |
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Restore native payload if absent
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"
      - name: Release build
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Sign and verify release
        env:
          KEYSTORE_B64: \${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: \${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: \${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: \${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: \${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then cp -f "$apk" "$out/app-release.apk"; fi
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$out/app-release.apk" | tee "$RUNNER_TEMP/rovex-signing.txt"
          grep -Fq '8decbeac906a40546b332f35629313ef6ba6860d1006aad07b761538228c0153' "$RUNNER_TEMP/rovex-signing.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-LATEST-release
          path: \${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
