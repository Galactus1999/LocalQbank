name: OFFLINE UPLOAD BUILD - Rovex

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - ".github/workflows/build-ben-qbank-v3.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select uploaded source
        shell: bash
        run: |
          set -euo pipefail
          selected="Rovex_v8.3.304_SectionDashboardCompileRepair.zip"

          mapfile -t changed_zips < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.zip' '*.ZIP' || true
          )

          if (( ${#changed_zips[@]} == 1 )); then
            selected="${changed_zips[0]}"
          elif (( ${#changed_zips[@]} > 1 )); then
            echo "ERROR: More than one ZIP changed:"
            printf '  %s\n' "${changed_zips[@]}"
            exit 1
          fi

          test -f "$GITHUB_WORKSPACE/$selected"
          test -s "$GITHUB_WORKSPACE/$selected"

          sha="$(sha256sum "$GITHUB_WORKSPACE/$selected" | awk '{print $1}')"
          size="$(stat -c%s "$GITHUB_WORKSPACE/$selected")"

          echo "SOURCE_ZIP=$GITHUB_WORKSPACE/$selected" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=$selected" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "SOURCE_SIZE=$size" >> "$GITHUB_ENV"

          echo "Selected: $selected"
          echo "SHA-256: $sha"
          echo "Size: $size bytes"

      - name: Extract and audit source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex/source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/rovex/source"

          project_file="$(find "$RUNNER_TEMP/rovex/source" -name settings.gradle.kts -type f -print -quit)"
          test -n "$project_file"
          project_dir="$(dirname "$project_file")"
          test -f "$project_dir/gradlew"
          chmod +x "$project_dir/gradlew"

          test "$SOURCE_SIZE" -lt 25000000
          test -f "$project_dir/app/build.gradle.kts"
          test -f "$project_dir/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -Fq 'applicationId = "com.localqbank.library"' "$project_dir/app/build.gradle.kts"

          python3 - "$project_dir" <<'PY'
import pathlib
import sys
import xml.etree.ElementTree as ET
root = pathlib.Path(sys.argv[1])
aid = "{http://schemas.android.com/apk/res/android}id"
for path in sorted(root.glob("app/src/main/res/layout/*.xml")):
    ids = [v[5:] for e in ET.parse(path).iter() if (v := e.attrib.get(aid, "")).startswith("@+id/")]
    if len(ids) != len(set(ids)):
        raise SystemExit(f"duplicate id in one layout: {path}")
print("XML_LAYOUT_AUDIT=PASS")
PY

          target="$project_dir/app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so"
          test -s "$target"

          echo "SOURCE_AUDIT=PASS"
          echo "NATIVE_PAYLOAD_AUDIT=PASS"

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          cd "$RUNNER_TEMP/rovex/source"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
