name: Build Ben QBank v3 - Rovex UI Revolution
# ARCHIVED PATCH-CHAIN BUILDER
# Intentionally manual-only. All automatic release builds now use the canonical
# source produced by the final-release workflow.
on:
  push:
    branches: [main]
    paths:
      - 'Rovex_v8.3.304_VISUAL_REVOLUTION_DEEP_REPAIRED_v2.zip'
      - '.github/workflows/build-ben-qbank-v3.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Prepare exact uploaded v8.3.304 source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          src="$GITHUB_WORKSPACE/Rovex_v8.3.304_VISUAL_REVOLUTION_DEEP_REPAIRED_v2.zip"
          test -s "$src"
          unzip -q "$src" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          grep -q 'versionName = "8.3.304"' "$d/app/build.gradle.kts"
          grep -q 'versionCode = 398' "$d/app/build.gradle.kts"
          grep -q 'RovexPopupTheme' "$d/app/src/main/java/com/localqbank/library/RovexPopupTheme.kt"
          grep -q 'RovexDialogTheme' "$d/app/src/main/java/com/localqbank/library/RovexDialogTheme.kt"
          test -f "$d/app/src/main/java/com/localqbank/library/RovexVisualRevolution304DeepAudit.kt"
      - name: Verify v8.3.304 daily study hub
        run: |
          set -euo pipefail
          echo "ROVEX_DAILY_HUB_SOURCE_SCAN"
          grep -n -C 2 'RovexDailyStudyHub' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt" || true
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'versionName = "8.3.304"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 398' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'ThemeManager.PASTEL' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.MINT' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.SUNSET' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.LAVENDER' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.AMOLED' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'RovexPopupTheme' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexPopupTheme.kt"
          grep -q 'RovexDialogTheme' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexDialogTheme.kt"
          grep -q 'RovexPopupTheme.apply(popup,box)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizActivity.kt"
          grep -q 'RovexPopupTheme.apply(popup,scrollPanel)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/QuizActivity.kt"
          ! grep -R -E -q 'Midnight Blue|Obsidian Night|Pandora • Avatar|Cosmos • Galaxy|AMOLED Dark' "$PROJECT_DIR/app/src/main/java"
          grep -q 'RovexThemeEngine.apply(activity)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ResilienceManager.kt"
          grep -q 'RovexThemeEngine.apply(a)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ResilienceManager.kt"
          grep -q 'GradientDrawable.Orientation.TL_BR' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'RadialGradient' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ThemeAtmosphereDrawable.kt"
          ! grep -q 'Midnight Blue' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -q 'Obsidian Night' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -q 'Pandora • Avatar' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -R -E -q 'ThemeManager\.(DARK|SEPIA|OBSIDIAN_NIGHT|MIDNIGHT|COSMOS|AVATAR)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library"
          checks=(
            "ROVEX_VISUAL_REVOLUTION_304|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeAuditMarker.kt"
            "RovexHomeRevolution.apply(this)|$PROJECT_DIR/app/src/main/java/com/localqbank/library/MainActivity.kt"
            "RovexLiveBackdrop|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt"
            "ImageView->image|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
            "ROVEX_PHASE_304_DAILY_STUDY_HUB|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexRoadmapMarker.kt"
            "RovexDailyStudyHub.install(a, content, pF)|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt"
            "ACTION_INSERT|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexDailyStudyHub.kt"
            "Daily Progress Heatmap|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexDailyStudyHub.kt"
            "Daily Schedule Planner|$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexDailyStudyHub.kt"
          )
          for item in "${checks[@]}"; do
            needle="${item%%|*}"
            file="${item#*|}"
            if ! grep -Fq "$needle" "$file"; then
              echo "ROVEX_VERIFY_FAIL needle=[$needle] file=[$file]"
              exit 1
            fi
            echo "ROVEX_VERIFY_OK needle=[$needle]"
          done
      - name: Package source under 25MB
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Rovex_v8.3.304_Final_Source.zip" . -x '.gradle/*' 'build/*' 'app/build/*'
          test "$(stat -c%s "$RUNNER_TEMP/Rovex_v8.3.304_Final_Source.zip")" -lt 25000000
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.304-source-under25mb
          path: ${{ runner.temp }}/Rovex_v8.3.304_Final_Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Gradle compatibility init
        run: |
          set -euo pipefail
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Restore native payload
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"
      - name: Release build
        run: cd "$PROJECT_DIR" && ./gradlew :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Normalize and sign release
        env:
          KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then cp -f "$apk" "$out/app-release.apk"; fi
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$out/app-release.apk" | tee "$RUNNER_TEMP/rovex-signing.txt"
          grep -Fq '8D:EC:BE:AC:90:6A:40:54:6B:33:2F:35:62:93:13:EF:6B:A6:86:0D:10:06:AA:D0:7B:76:15:38:22:8C:01:53' "$RUNNER_TEMP/rovex-signing.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.304-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
