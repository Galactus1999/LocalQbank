name: Build Ben QBank v3 - Rovex UI Revolution
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'platform-tools' 'build-tools;35.0.0'
      - name: Prepare Rovex v8.3.303
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/rovex"
          unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.295_Ben_Fast_Table_Durability_Final.zip" -d "$RUNNER_TEMP/rovex"
          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
          for n in 296 297 298 299 300; do
            cp "$GITHUB_WORKSPACE/tools/patch_${n}.py" "$d/patch_${n}.py"
            (cd "$d" && python3 "patch_${n}.py" && rm -f "patch_${n}.py")
          done
          cp "$GITHUB_WORKSPACE/tools/patch_301.py" "$d/patch_301.py"
          cp -a "$GITHUB_WORKSPACE/tools/theme301" "$d/theme301"
          (cd "$d" && python3 patch_301.py && rm -f patch_301.py && rm -rf theme301)
          cp "$GITHUB_WORKSPACE/tools/patch_302.py" "$d/patch_302.py"
          (cd "$d" && python3 patch_302.py && rm -f patch_302.py)
          cp "$GITHUB_WORKSPACE/tools/patch_303.py" "$d/patch_303.py"
          (cd "$d" && python3 patch_303.py && rm -f patch_303.py)
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*37/compileSdk = 36/g' "$d/app/build.gradle.kts"
          r="$d/app/src/main/java/com/localqbank/library/RenActivity.kt"
          grep -q 'import android.view.ViewGroup' "$r" || sed -i '/import android.view.View$/a import android.view.ViewGroup' "$r"
          q="$d/app/src/main/java/com/localqbank/library/QuizActivity.kt"
          sed -i 's/apply { tag=/apply { this.tag=/' "$q"
          sed -i 's/^                    tag = "quiz:" + role$/                    this.tag = "quiz:" + role/' "$q"
      - name: Verify v8.3.303 UI revolution
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'versionName = "8.3.303"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 397' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'ThemeManager.PASTEL' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.MINT' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.SUNSET' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.LAVENDER' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'ThemeManager.AMOLED' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          grep -q 'RovexThemeEngine.apply(activity)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ResilienceManager.kt"
          grep -q 'RovexThemeEngine.apply(a)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ResilienceManager.kt"
          grep -q 'GradientDrawable.Orientation.TL_BR' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'RadialGradient' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/ThemeAtmosphereDrawable.kt"
          ! grep -q 'Midnight Blue' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -q 'Obsidian Night' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -q 'Pandora • Avatar' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/SettingsScreen.kt"
          ! grep -R -E -q 'ThemeManager\.(DARK|SEPIA|OBSIDIAN_NIGHT|MIDNIGHT|COSMOS|AVATAR)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library"
          grep -q 'ROVEX_UI_REVOLUTION_303' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexRevolutionAuditMarker.kt"
          grep -q 'RovexHomeRevolution.apply(this)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/MainActivity.kt"
          grep -q 'RovexLiveBackdrop' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt"
          grep -q 'ImageView->image' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
      - name: Package source under 25MB
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Rovex_v8.3.303_Final_Source.zip" . -x '.gradle/*' 'build/*' 'app/build/*'
          test "$(stat -c%s "$RUNNER_TEMP/Rovex_v8.3.301_Final_Source.zip")" -lt 25000000
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.303-source-under25mb
          path: ${{ runner.temp }}/Rovex_v8.3.301_Final_Source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Gradle compatibility init
        run: |
          set -euo pipefail
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Restore native payload
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"
      - name: Release build
        run: cd "$PROJECT_DIR" && ./gradlew :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"
      - name: Normalize and sign release
        env:
          KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then cp -f "$apk" "$out/app-release.apk"; fi
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$out/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.303-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
