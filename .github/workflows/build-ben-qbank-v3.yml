name: Rovex Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow sanity
        run: |
          echo "WORKFLOW_SANITY=PASS"
          echo "COMMIT=$GITHUB_SHA"
