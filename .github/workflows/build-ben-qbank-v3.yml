name: Rovex Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Acquire latest source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/source-artifact" "$RUNNER_TEMP/rovex"
          mkdir -p "$RUNNER_TEMP/source-artifact" "$RUNNER_TEMP/rovex"

          latest_run="$(gh run list --workflow 363295810 --repo "$GITHUB_REPOSITORY" --status success --limit 20 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$latest_run" ] && [ "$latest_run" != "$GITHUB_RUN_ID" ]; then
            echo "Using all artifacts from latest successful build: $latest_run"
            gh run download "$latest_run" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/source-artifact"
          fi

          python3 - "$RUNNER_TEMP/source-artifact" "$RUNNER_TEMP/rovex" <<'PY'
          import io, os, sys, zipfile
          root, out = sys.argv[1], sys.argv[2]
          seen=set()
          
          def valid(names):
              n={x.rstrip('/') for x in names}
              return any(x.endswith('/settings.gradle.kts') or x=='settings.gradle.kts' or x.endswith('/settings.gradle') or x=='settings.gradle' for x in n) and            any(x.endswith('/app/build.gradle.kts') or x=='app/build.gradle.kts' or x.endswith('/app/build.gradle') or x=='app/build.gradle' for x in n) and            any(x.endswith('/gradlew') or x=='gradlew' for x in n)
          
          def scan_zip(path, depth=0):
              if path in seen or depth > 3:
                  return False
              seen.add(path)
              try:
                  with zipfile.ZipFile(path) as z:
                      if valid(z.namelist()):
                          z.extractall(out)
                          return True
                      nested=[n for n in z.namelist() if n.lower().endswith('.zip') and not n.endswith('/')]
                      for n in nested:
                          data=z.read(n)
                          try:
                              with zipfile.ZipFile(io.BytesIO(data)) as nz:
                                  if valid(nz.namelist()):
                                      nz.extractall(out)
                                      return True
                                  tmp=os.path.join(root, f"_nested_{len(seen)}.zip")
                                  open(tmp,'wb').write(data)
                                  if scan_zip(tmp, depth+1):
                                      return True
                          except zipfile.BadZipFile:
                              continue
              except zipfile.BadZipFile:
                  return False
              return False
          
          candidates=[]
          for dp,_,fs in os.walk(root):
              for f in fs:
                  if f.lower().endswith('.zip') and f != 'build-artifact.zip':
                      candidates.append(os.path.join(dp,f))
          for p in sorted(candidates, key=lambda x:(os.path.getmtime(x),x), reverse=True):
              if scan_zip(p):
                  print("SOURCE_FOUND="+p)
                  break
          else:
              raise SystemExit("No Android project source archive found in latest successful build artifact")
          PY
          
          # Restore a separately transported Qualcomm runtime archive when present.
          runtime_archive="$(find "$RUNNER_TEMP/source-artifact" -type f -name 'Rovex_Qualcomm_Runtime.zip' -print -quit || true)"
          if [ -n "$runtime_archive" ]; then
            mkdir -p "$RUNNER_TEMP/qualcomm-runtime"
            unzip -q "$runtime_archive" -d "$RUNNER_TEMP/qualcomm-runtime"
            mkdir -p "$RUNNER_TEMP/rovex/app/src/main"
            cp -a "$RUNNER_TEMP/qualcomm-runtime/app/src/main/jniLibs" "$RUNNER_TEMP/rovex/app/src/main/" 2>/dev/null || true
            cp -a "$RUNNER_TEMP/qualcomm-runtime/jniLibs" "$RUNNER_TEMP/rovex/app/src/main/" 2>/dev/null || true
          fi

          settings_file="$(find "$RUNNER_TEMP/rovex" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$settings_file"
          project_dir="$(dirname "$settings_file")"
          test -f "$project_dir/gradlew"
          test -f "$project_dir/app/build.gradle.kts" -o -f "$project_dir/app/build.gradle"
          if [ -f "$project_dir/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 36/compileSdk = 37/g' "$project_dir/app/build.gradle.kts"
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

