name: Rovex Adaptive Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_file:
        description: "Optional source ZIP/path"
        required: false
        default: ""
        type: string
      strict:
        description: "Require optional signing/Qualcomm capabilities"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  automatic:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_adaptive-android.yml
    secrets: inherit

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_adaptive-android.yml
    with:
      source_file: ${{ inputs.source_file }}
      strict: ${{ inputs.strict }}
    secrets: inherit
