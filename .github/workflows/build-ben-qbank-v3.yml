          name: Rovex-8.3.304-release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/Rovex_v8.3.304_Corrected_Source.zip
          if-no-files-found: error
          retention-days: 30
; then
              project_root="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/previous-artifact" -type f \( -name '*.zip' -o -name '*.ZIP' \) -print | sort -r)

          if [ -z "$project_root" ]; then
            echo "No valid Android project archive found in latest successful build artifacts." >&2
            find "$RUNNER_TEMP/previous-artifact" -maxdepth 4 -type f -print >&2
            exit 1
          fi
          echo "Using discovered source payload: $project_root"
          unzip -q "$project_root" -d "$RUNNER_TEMP/rovex"

          settings_file="$(find "$RUNNER_TEMP/rovex" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$settings_file"
          PROJECT_DISCOVERED_DIR="$(dirname "$settings_file")"
          test -f "$PROJECT_DISCOVERED_DIR/app/build.gradle.kts" -o -f "$PROJECT_DISCOVERED_DIR/app/build.gradle"
          if [ -f "$PROJECT_DISCOVERED_DIR/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 36/compileSdk = 37/' "$PROJECT_DISCOVERED_DIR/app/build.gradle.kts"
          fi
          rm -rf "$RUNNER_TEMP/clean-source"
          cp -a "$RUNNER_TEMP/rovex" "$RUNNER_TEMP/clean-source"
          echo "PROJECT_DIR=$RUNNER_TEMP/rovex" >> "$GITHUB_ENV"
