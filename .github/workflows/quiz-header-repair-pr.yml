name: Quiz Header Repair Verification

on:
  pull_request:
    paths:
      - ".github/ci/rovex_678_quiz_statusbar_performance.py"
      - ".github/workflows/quiz-header-repair-pr.yml"
      - "Rovex_Todays_Green_Build_Source_Fixed_HomeMotionHeader.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0"
      - name: Extract baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rovex-source"
          unzip -q Rovex_Todays_Green_Build_Source_Fixed_HomeMotionHeader.zip -d "$RUNNER_TEMP/rovex-source"
          PROJECT="$(find "$RUNNER_TEMP/rovex-source" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)"
          test -n "$PROJECT" && test -f "$PROJECT/gradlew"
          echo "ROVEX_PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply verified overlays and quiz repair
        run: |
          set -euo pipefail
          for phase in 664_wallpaper_phase2 665_liquid_glass_repair 666_cross_theme_audit 667_motion_surface_repair 668_static_glass_splash 669_black_hole_prototype 670_glass_optics_repair 671_liquid_glass_prototype 672_theme_contrast_header 673_header_diagnostic 674_header_builder_map 675_layout_inset_map 676_compact_quiz_header 677_quiz_header_contrast 678_quiz_statusbar_performance; do
            python3 ".github/ci/rovex_${phase}.py" "$ROVEX_PROJECT"
          done
      - name: Run JVM tests
        run: |
          cd "$ROVEX_PROJECT"
          ./gradlew test --no-daemon --stacktrace
      - name: Build debug and release
        run: |
          cd "$ROVEX_PROJECT"
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Upload candidate APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-header-repair-candidate
          path: |
            ${{ env.ROVEX_PROJECT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
