name: Rovex Cloud Gateway Extract
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"; mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          cat "$p/app/src/main/java/com/localqbank/library/BenCloudAiGateway.kt"
          echo '=== PDF ACTIVITY FILES ==='
          find "$p/app/src/main" -type f -iname '*Pdf*' -print | while read f; do echo "### $f"; cat "$f"; done
