name: Rovex AI Provider API Audit
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"; mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          echo '=== CLOUD AI ==='
          grep -RIn --include='*.kt' -E 'class .*CloudAi|interface .*CloudAi|object .*CloudAi|fun generate|fun stream|suspend.*generate|OpenRouter|DeepSeek|deepseek|openrouter' "$p/app/src/main/java/com/localqbank/library" | head -n 500
          echo '=== FREE AI MENU ==='
          f="$p/app/src/main/java/com/localqbank/library/RenActivity.kt"; nl -ba "$f" | sed -n '330,520p'
