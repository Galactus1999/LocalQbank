name: Rovex Progress Status Extract
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"; mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          grep -RIn --include='*.kt' -E 'set.*status|status.*correct|status.*wrong|put.*status|":status"|status"' "$p/app/src/main/java/com/localqbank/library" | head -n 300
