name: Workflow Lint
# Adaptive CI validator: workflow and shell contracts only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint active adaptive workflows
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/build-ben-qbank-v3.yml .github/workflows/_adaptive-android.yml .github/workflows/workflow-lint.yml; do
            actionlint -color "$f"
          done
      - name: Compile CI Python validators and overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ci/rovex_649_visual_truth_capture_repair.py .github/ci/test_visual_truth_capture.py tools/rovex_visual_truth.py

      - name: Lint active adaptive shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/ci/adaptive-discover.sh .github/ci/adaptive-gradle-tasks.sh .github/ci/adaptive-instrumentation.sh .github/ci/adaptive-instrumentation-v2.sh .github/ci/rovex_visual_truth_capture.sh; do
            bash -n "$f"
            shellcheck -x "$f"
          done
