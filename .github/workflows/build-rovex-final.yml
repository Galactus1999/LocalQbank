name: Rovex Final Release

on:
  workflow_run:
    workflows: ["Rovex Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh run list --workflow 363295810 --repo "$GITHUB_REPOSITORY" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$run_id"
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/final"
          apk="$(find "$RUNNER_TEMP/final" -type f -name '*.apk' -print -quit)"
          source_zip=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" | grep -Eq '(^|/)settings[.]gradle([.]kts)?$' &&
               unzip -l "$candidate" | grep -Eq '(^|/)app/build[.]gradle([.]kts)?$' &&
               unzip -l "$candidate" | grep -Eq '(^|/)gradlew$'; then
              source_zip="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/final" -type f -iname '*.zip' -print | sort -r)
          test -n "$apk"
          test -n "$source_zip"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$source_zip" >> "$GITHUB_ENV"

      - name: Verify final artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK"
          test -s "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null
          unzip -l "$APK" | grep -Fq 'lib/arm64-v8a/libQnnHtp.so'
          unzip -l "$APK" | grep -Fq 'lib/arm64-v8a/libLiteRtDispatch_Qualcomm.so'
          echo "FINAL_ARTIFACT_AUDIT=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-Final-Release
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 90
