name: Rovex Final Release - Canonical Source

on:
  # Release is downstream of the staging/source workflow. This prevents the
  # final APK from silently rebuilding an older repository snapshot.
  workflow_run:
    workflows: ["Rovex Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-37' 'platform-tools' 'build-tools;36.0.0'

      - name: Materialize latest source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rovex" "$RUNNER_TEMP/source-artifact"
          mkdir -p "$RUNNER_TEMP/rovex" "$RUNNER_TEMP/source-artifact"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            source_run="${{ github.event.workflow_run.id }}"
          else
            echo "Manual final-release dispatch is disabled until a successful latest staging run exists." >&2
            exit 1
          fi

          gh run download "$source_run" \
            --repo "${{ github.repository }}" \
            --name Rovex-8.3.304-release \
            --dir "$RUNNER_TEMP/source-artifact"

          src_zip="$(find "$RUNNER_TEMP/source-artifact" -type f -name 'Rovex_v8.3.304_Corrected_Source.zip' -print -quit)"
          test -n "$src_zip"
          unzip -q "$src_zip" -d "$RUNNER_TEMP/rovex"

          p="$(find "$RUNNER_TEMP/rovex" -name settings.gradle.kts -type f -print -quit)"
          test -n "$p"
          d="$(dirname "$p")"
          chmod +x "$d/gradlew"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - name: Verify canonical v8.3.304 source
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexThemeEngine.kt"
          grep -q 'versionName = "8.3.304"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'applicationId = "com.localqbank.library"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 398' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'RovexHomeRevolution.apply(this)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/MainActivity.kt"
          grep -q 'RovexLiveBackdrop' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt"
          grep -q 'ROVEX_PHASE_304_DAILY_STUDY_HUB' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexRoadmapMarker.kt"
          grep -q 'RovexDailyStudyHub.install(a, content, pF)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library/RovexHomeRevolution.kt"
          ! grep -R -E -q 'ThemeManager\\.(DARK|SEPIA|OBSIDIAN_NIGHT|MIDNIGHT|COSMOS|AVATAR)' "$PROJECT_DIR/app/src/main/java/com/localqbank/library"

      - name: Prepare Gradle compatibility init
        run: |
          set -euo pipefail
          printf '%s\n' 'gradle.projectsEvaluated { allprojects { project -> project.tasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false } } }' > "$RUNNER_TEMP/disable-aar-metadata.gradle"

      - name: Restore native payload
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          target=app/src/main/jniLibs/arm64-v8a/libQnnHtpPrepare.so
          if [ ! -s "$target" ]; then
            rm -rf "$RUNNER_TEMP/qnn"; mkdir -p "$RUNNER_TEMP/qnn"
            unzip -q "$GITHUB_WORKSPACE/Rovex_v8.3.278_Final_Stability_Verified_Source.zip" 'app/src/main/jniLibs/*' -d "$RUNNER_TEMP/qnn"
            rm -rf app/src/main/jniLibs
            cp -a "$RUNNER_TEMP/qnn/app/src/main/jniLibs" app/src/main/
          fi
          test -s "$target"

      - name: Release build
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --init-script "$RUNNER_TEMP/disable-aar-metadata.gradle"

      - name: Normalize and sign release
        env:
          KEYSTORE_B64: ${{ secrets.ROVEX_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_B64_LEGACY: ${{ secrets.ROVEX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ROVEX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/app/build/outputs/apk/release"
          apk="$(find "$out" -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk"
          if [ "$apk" != "$out/app-release.apk" ]; then cp -f "$apk" "$out/app-release.apk"; fi
          if [ -z "$KEYSTORE_B64" ]; then KEYSTORE_B64="$KEYSTORE_B64_LEGACY"; fi
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          ks="$RUNNER_TEMP/rovex-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$ks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$out/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$out/app-release.apk" | tee "$RUNNER_TEMP/rovex-signing.txt"
          grep -q 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/rovex-signing.txt"
          expected='8D:EC:BE:AC:90:6A:40:54:6B:33:2F:35:62:93:13:EF:6B:A6:86:0D:10:06:AA:D0:7B:76:15:38:22:8C:01:53'
          grep -Fq "$expected" "$RUNNER_TEMP/rovex-signing.txt"

      - name: Package canonical source
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Rovex_v8.3.304_Canonical_Source.zip" . -x '.gradle/*' 'build/*' 'app/build/*'
          test "$(stat -c%s "$RUNNER_TEMP/Rovex_v8.3.304_Canonical_Source.zip")" -lt 25000000

      - name: Promote canonical source into repository
        if: ${{ !hashFiles('ROVEX_CANONICAL_SOURCE.txt') }}
        run: |
          set -euo pipefail
          rsync -a             --exclude='.git/'             --exclude='.gradle/'             --exclude='build/'             --exclude='app/build/'             "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          printf '%s\n' 'Rovex v8.3.304 canonical source. Future automatic builds use this source directly; patch-chain builds are retired.' > "$GITHUB_WORKSPACE/ROVEX_CANONICAL_SOURCE.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Rovex v8.3.304 canonical source [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.304-CANONICAL-SOURCE
          path: ${{ runner.temp }}/Rovex_v8.3.304_Canonical_Source.zip
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: Rovex-v8.3.304-FINAL-RELEASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
