name: Rovex Main Metrics Extract
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          z="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"; mkdir work; unzip -q "$z" -d work
          p="$(dirname "$(find work -name settings.gradle.kts -type f -print -quit)")"
          nl -ba "$p/app/src/main/java/com/localqbank/library/MainActivity.kt" | sed -n '100,145p'
          nl -ba "$p/app/src/main/res/layout/activity_main.xml" | sed -n '1,90p'
