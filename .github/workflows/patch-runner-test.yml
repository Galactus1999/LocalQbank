name: Apply Rovex 8.3.265 UX AI PDF Patch
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic patch
        run: |
          set -euo pipefail
          python3 rovex_patch_8265.py
          rm -rf work
          zips=( *.zip )
          test "${#zips[@]}" -eq 1
          old="${zips[0]}"
          new=Rovex_v8_3_265_Minimal_UI_User_Performance_FastAI_PDF_Library_Source.zip
          test -f "$new" || (cd work && zip -qr "../$new" .)
          unzip -tq "$new"
          sha256sum "$new"
          git rm -f --ignore-unmatch "$old"
          git add "$new"
          git config user.name "Rovex Build Agent"
          git config user.email "rohitkokane9872@gmail.com"
          git rm -f --ignore-unmatch rovex_patch_8265.py .github/workflows/apply-8.3.265.yml .github/workflows/patch-runner-test.yml
          git add -A
          git commit -m "feat: minimal UX user performance fast AI and PDF library"
          git push
